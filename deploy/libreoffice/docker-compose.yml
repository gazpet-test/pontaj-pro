# SCHIȚĂ — nu e pornit. Izolare: fără rețea, rootfs read-only, fără capabilități, limite de resurse.
services:
  convertor-doc:
    build: .
    network_mode: "none"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    volumes:
      - /volume1/docker/ofertare-conv:/conv   # același director montat și în workerul ofertare
    restart: unless-stopped
