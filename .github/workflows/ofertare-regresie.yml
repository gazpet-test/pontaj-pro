name: Ofertare - regresie determinista

on:
  pull_request:
    paths:
      - 'src/ofertare*'
      - 'src/Ofertare*'
      - 'src/grafic*'
      - 'supabase/functions/ofertare-**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/20260929b_ofertare_derogare_audit*.sql'
      - 'supabase/migrations/20260930a_ofertare_pachet_hash_server_jakv202*.sql'
      - 'supabase/migrations/20261003a_ofertare_poarta_server_jakv2p3*.sql'
      - 'supabase/migrations/20261014b_ofertare_clarificari_temeiuri*.sql'
      - 'supabase/revenire/20261014b_ofertare_clarificari_temeiuri*.sql'
      - 'test-fixtures/jakv2p3/**'
      - 'scripts/test-jakv2p3.mjs'
      - 'scripts/test-jakv202-hash-server.mjs'
      - 'scripts/test-j04-j07-integrare.mjs'
      - 'api/_poartaOfertare*'
      - 'api/cad-parse.js'
      - 'api/pdf-sparge.js'
      - 'api/plansa-felii.js'
      - 'api/seap-import.js'
      - 'api/_tipDocument.js'
      - 'api/_seapImport*'
      - 'docs/R5_*.sql'
      - 'docs/R5_MIGRARE_3*'
      - 'docs/R4_MIGRARE_PROPUSA_ofertare_plansa_coada.sql'
      - 'worker/ofertare/plansa*.ts'
      - 'worker/ofertare/seap.ts'
      - 'worker/ofertare/egress.ts'
      - 'worker/ofertare/arhive_platforma_test.ts'
      - 'supabase/functions/api-consum-extern/**'
      - 'src/apiConsum*'
      - 'src/ApiConsumExtern.jsx'
      - 'scripts/pg/**'
      - 'supabase/tests/j04xj07/**'
      - 'scripts/test_j04xj07.sh'
      - 'scripts/test-r5-r9b.mjs'
      - '.github/workflows/ofertare-regresie.yml'
  push:
    branches: [main]
    paths:
      - 'src/ofertare*'
      - 'src/Ofertare*'
      - 'src/grafic*'
      - 'supabase/functions/ofertare-**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/20260929b_ofertare_derogare_audit*.sql'
      - 'supabase/migrations/20260930a_ofertare_pachet_hash_server_jakv202*.sql'
      - 'supabase/migrations/20261003a_ofertare_poarta_server_jakv2p3*.sql'
      - 'supabase/migrations/20261014b_ofertare_clarificari_temeiuri*.sql'
      - 'supabase/revenire/20261014b_ofertare_clarificari_temeiuri*.sql'
      - 'test-fixtures/jakv2p3/**'
      - 'scripts/test-jakv2p3.mjs'
      - 'scripts/test-jakv202-hash-server.mjs'
      - 'scripts/test-j04-j07-integrare.mjs'
      - 'api/_poartaOfertare*'
      - 'api/cad-parse.js'
      - 'api/pdf-sparge.js'
      - 'api/plansa-felii.js'
      - 'api/seap-import.js'
      - 'api/_tipDocument.js'
      - 'api/_seapImport*'
      - 'docs/R5_*.sql'
      - 'docs/R5_MIGRARE_3*'
      - 'docs/R4_MIGRARE_PROPUSA_ofertare_plansa_coada.sql'
      - 'worker/ofertare/plansa*.ts'
      - 'worker/ofertare/seap.ts'
      - 'worker/ofertare/egress.ts'
      - 'worker/ofertare/arhive_platforma_test.ts'
      - 'supabase/functions/api-consum-extern/**'
      - 'src/apiConsum*'
      - 'src/ApiConsumExtern.jsx'
      - 'scripts/pg/**'
      - 'supabase/tests/j04xj07/**'
      - 'scripts/test_j04xj07.sh'
      - 'scripts/test-r5-r9b.mjs'
      - '.github/workflows/ofertare-regresie.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Vitest - ofertare si grafic
        run: npx vitest run src/ofertare src/grafic src/Ofertare src/apiConsum api/_poartaOfertare.test.js api/_seapImport.test.js
      - name: Regresie R5-R9b fara dependente
        run: node --test scripts/test-r5-r9b.mjs
      - name: Poarta J07 - paritate UI si Edge
        run: node --test scripts/test-jakv2p3.mjs
      - name: J04 x J07 - UI cere ambele verificari inainte de depus; ordinea migrarilor
        run: node --test scripts/test-j04-j07-integrare.mjs

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Testele injecteaza clienti/fetch simulate; nu primesc secrete.
      # Ca jobul `poarta` existent: fără --frozen (deno.lock nu acoperă dependențele testelor).
      - name: Regresie Edge Functions cu dependente simulate
        run: >-
          deno test -A --node-modules-dir=none
          supabase/functions/_shared
          supabase/functions/ofertare-plansa-citeste
          supabase/functions/ofertare-clarificari-propune
          supabase/functions/ofertare-document-nou-citeste
          supabase/functions/ofertare-poarta-text
          supabase/functions/api-consum-extern
          worker/ofertare/plansa_test.ts
          worker/ofertare/arhive_platforma_test.ts
      # J04: testul node:test importă handler-ul .ts, deci rulează sub Deno (Node 20 nu elimină tipurile).
      - name: Hash pe server J04 - logica edge, poarta si paritatea rolurilor
        run: deno test -A --node-modules-dir=none scripts/test-jakv202-hash-server.mjs

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Node 22 (>= 22.18): suita J04 x J07 importa handler-ele .ts REALE ale edge-urilor (type stripping implicit).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instaleaza clientul PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Probe R9b 2 si 3 pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/r9b
          PGPASSWORD: postgres
        run: node scripts/pg/test_r9b_probe23.mjs
      - name: Regresie F01-F06 pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/r9b_test_review_f
          PGPASSWORD: postgres
        run: node scripts/pg/test_r5_review_f.mjs
      - name: Coada de planșe pe NAS (R4 #142) pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/r9b_test_coada_plansa
          PGPASSWORD: postgres
        run: node scripts/pg/test_r4_coada_plansa.mjs
      - name: Matricea de tranziții pachet (JAK-V2-01) pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/r9b_test_jakv201
          PGPASSWORD: postgres
        run: node scripts/pg/test_jakv201_tranzitie.mjs
      - name: Creeaza baza goala pt JAK-V2-07
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE jakv207_test_ci;'
      - name: RLS scriere Ofertare + DELETE owner (JAK-V2-07) pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/jakv207_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_jakv207_rls.mjs
      - name: Creeaza baza goala pt JAK-V2-03
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE jakv203_test_ci;'
      - name: Poarta depusa cu pachet si cerinte (JAK-V2-03) pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/jakv203_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_jakv203_gate_depusa.mjs
      - name: Creeaza baza goala pt JAK-V2-05
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE jakv205_test_ci;'
      - name: Audit append-only derogare depunere (JAK-V2-05) pe PostgreSQL 16 local
        env:
          PGURI: postgres://postgres@localhost:5432/jakv205_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_jakv205_derogare_audit.mjs
      - name: Creeaza baza goala pt J07 P3
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE jakv2p3_test_ci;'
      - name: Poarta server J07 - controale, invalidare si regresii
        env:
          PGURI: postgres://postgres@localhost:5432/jakv2p3_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_jakv2p3_poarta_server.mjs
      - name: Creeaza baza goala pt J04
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE jakv202_test_ci;'
      - name: Hash pe server J04 - dovezi append-only si tranzitia depus
        env:
          PGURI: postgres://postgres@localhost:5432/jakv202_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_jakv202_hash_server.mjs
      - name: Creeaza baza goala pt integrarea J04 x J07
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE jakv0407_test_ci;'
      - name: Integrare J04 x J07 - ambele porti impuse la aprobat->depus, migrari J04->J07
        env:
          PGURI: postgres://postgres@localhost:5432/jakv0407_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_j04_j07_integrare.mjs
      # Suita extinsa J04 x J07 (COPILOT_REVIEW_PLAN_A §2): teste SQL cu ASSERT (supabase/tests/j04xj07), fiecare in
      # BEGIN...ROLLBACK; runner-ul isi creeaza si isi sterge singur bazele (jakv0407_test_jx + clona pentru 2 sesiuni).
      - name: J04 x J07 extins - suita SQL JX-* (simetric, 12 controale, concurenta, parser, API, append-only, A-B)
        env:
          PGURI_ADMIN: postgres://postgres@localhost:5432/postgres
          PGPASSWORD: postgres
        run: node scripts/pg/test_j04xj07.mjs
      # Verificarea prin mutatii: fiecare implementare stricata din catalog (SQL + edge, M1...M19 + X*) trebuie UCISA de
      # cel putin un test functional; controlul negativ M00_noop trebuie sa SUPRAVIETUIASCA. Cate o baza per mutant.
      - name: J04 x J07 extins - mutanti (fiecare implementare stricata trebuie prinsa de un test)
        env:
          PGURI_ADMIN: postgres://postgres@localhost:5432/postgres
          PGPASSWORD: postgres
          JX_PARALEL: '3'
          JX_JURNALE: mutanti_j04xj07
        run: node scripts/pg/test_j04xj07_mutanti.mjs
      - name: Creeaza baza goala pt temeiuri (pasul B juridic)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE temeiuri_test_ci;'
      - name: Temeiuri CNSC (PR #615) - citat inghetat, poarta owner pe starea tintei, retrageri, 2 curse concurente
        env:
          PGURI: postgres://postgres@localhost:5432/temeiuri_test_ci
          PGPASSWORD: postgres
        run: node scripts/pg/test_temeiuri_owner_gate.mjs
