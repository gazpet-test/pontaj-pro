name: Deploy edge function (manual)

# Publică în producție una sau mai multe edge functions din main. Pornire DOAR manuală
# (workflow_dispatch) — cine are drept de Actions write pe repo. Vezi registru_automatizari.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug(uri) edge function, separate prin virgulă (ex: ofertare-acoperire,hr-digest-saptamanal)'
        required: true
        type: string

concurrency:
  group: deploy-edge-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # esbuild (vine prin vite) e necesar pasului „Rezumat repo vs producție” (scripts/edgeDependente.mjs).
      # Fără el pasul pica la fiecare deploy (ERR_MODULE_NOT_FOUND, 19.10.2026). --ignore-scripts: jobul are
      # tokenul de deploy, deci nu rulăm scripturile de instalare ale pachetelor; binarul esbuild vine din pachetul de platformă.
      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Validează slug-urile
        id: val
        env:
          SLUGS: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          lista=""
          IFS=',' read -ra ARR <<< "$SLUGS"
          for s in "${ARR[@]}"; do
            s="$(echo "$s" | tr -d '[:space:]')"
            [ -z "$s" ] && continue
            if ! [[ "$s" =~ ^[a-z0-9_-]+$ ]]; then
              echo "::error::Slug invalid: '$s' (doar [a-z0-9-_])"; exit 1
            fi
            if [ ! -f "supabase/functions/$s/index.ts" ]; then
              echo "::error::Nu există supabase/functions/$s/index.ts"; exit 1
            fi
            lista="$lista $s"
          done
          [ -z "$lista" ] && { echo "::error::Niciun slug valid"; exit 1; }
          echo "lista=$lista" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LISTA: ${{ steps.val.outputs.lista }}
        run: |
          set -euo pipefail
          # Funcțiile care rulează LIVE cu verify_jwt=false (listă derivată din
          # list_edge_functions la 25.09.2026). Au autentificare proprie în cod (cron/webhook/QR).
          # O funcție nouă cu verify_jwt=false trebuie adăugată AICI, altfel pleacă cu true.
          # 03.10.2026 (#17): + cleanup-recycle-bin, detect-ordine (poarta x-intern-secret/Vault în cod) și
          # tmp-probe-url (stub 410). citeste-orice rămâne cu verify_jwt=true + aceeași poartă.
          # 05.10.2026 (#616): + api-consum-extern — cronul api_consum_extern_zilnic trimite DOAR x-intern-secret din Vault
          # (fără JWT); poarta e în cod: esteApelIntern SAU JWT verificat cu auth.getUser + profiles.is_owner (401/403).
          # 14.10.2026 (D3b, PR #698): + ofertare-pdf-link, ofertare-ocr-scrie, ofertare-ocr-arbitreaza — apelate de serverul AI fără cont
          # Supabase; poarta în cod: x-ocr-local-secret = Vault OCR_LOCAL_SECRET (fn_verifica_secret, fail closed).
          # 14.10.2026 (securitate etapa 2, grup C): + ocr-packing-list, parse-anexa-pdf, parse-contract-pdf, parse-pccvi-faze —
          # rulau deja cu verify_jwt=false; poarta e în cod (JWT verificat cu auth.getUser + profil / modul), fără cale internă.
          # 14.10.2026 (securitate etapa 2, grup A): + detect_plate_orphan_msgs — rula deja cu verify_jwt=false; scos antetul de ocolire
          # cu literal; poarta în cod (acces.ts: JWT + owner SAU rol admin_logistica cu modulul logistica). extract_external_bon NU e aici:
          # e stub 410 (retrasă), se publică cu verify_jwt=true.
          # 14.10.2026 (securitate etapa 2, grup B): NICIUN slug nou aici. extract-talon-ai rula deja cu verify_jwt=true și rămâne așa
          # (poarta din cod — acces.ts: JWT + owner SAU rol admin_logistica cu modulul logistica — vine în plus, ca la citeste-orice);
          # rag-normative rula cu verify_jwt=false, acum e stub 410 (retrasă) și se publică cu verify_jwt=true (CI verifică lipsa din NO_JWT).
          # 23.10.2026 (E9 local, #1833): + izo-e3-ocr-local — workerul de pe serverul AI apelează fără JWT; poarta în cod:
          # x-izo-ocr-local-secret = Vault IZO_OCR_LOCAL_SECRET (fn_verifica_secret); operațiile UI cer JWT verificat cu auth.getUser.
          # 03.11.2026 (SMS MVP): + sms-dlr — webhook-ul DLR al furnizorului SMS (SMSLink nu are JWT); poarta in cod (logica.ts): doar POST,
          # secretul SMS_DLR_SECRET din URL comparat in timp constant + connection_id al nostru; scrie DOAR prin fn_sms_dlr_aplica, nu trimite nimic.
          # sms-trimite NU e aici (verify_jwt=true + poarta owner / cron intern in cod).
          # 04.11.2026 (20261130d): + sms-sold — cronul pg_cron sms_sold_zilnic apeleaza fara JWT; poarta in cod (logica.ts): x-intern-secret
          # (Vault INTERN_EDGE_SECRET) SAU JWT de owner (auth.getUser + fn_sms_nivel() = 'owner'); citeste doar soldul, scrie DOAR prin fn_sold_sms_inregistreaza.
          # 04.11.2026 (Redari #980): + redari-coresp-mail - apelata din UI (preflight CORS fara Authorization); poarta in cod:
          # auth.getUser + fn_red_nivel admin/editor prin RPC-urile fn_red_coresp_mail_* (JWT-ul utilizatorului, fara service_role).
          # 10.11.2026 (Polițe #1043, 20261205a): + polite-alerte-mail — cronul pg_cron polite_alerte_departamente apelează fără JWT;
          # poarta în cod: x-intern-secret (Vault INTERN_EDGE_SECRET) SAU JWT de owner (cronSauOwner); polita-citeste rămâne cu verify_jwt=true + poarta în cod.
          NO_JWT=" api-consum-extern cleanup-recycle-bin detect-ordine detect_plate_orphan_msgs dovezi-valabilitate-alerta hr-autorizatii-scan hr-digest-saptamanal hr-extrage-ci iot-retea izo-e3-ocr-local izo-e3-ocr-local iot-terra meta-publish meteo-sync nas-upload-url noutati-mail ocr-packing-list parse-anexa-pdf parse-contract-pdf parse-pccvi-faze ofertare-alerte-mail ofertare-cantitati-extrage ofertare-document-nou-citeste ofertare-etapa1-mail ofertare-fisier-semnat ofertare-garantie-mail ofertare-ocr-arbitreaza ofertare-ocr-scrie ofertare-participari-import ofertare-pdf-link ofertare-radar-scan ofertare-rc-necitit ofertare-rfq-inbox ofertare-seap-veghe ofertare-verificare-finala ofertare-word-text olx-aplicari-sync polite-alerte-mail recrutare-aplica salus redari-coresp-mail sms-dlr sms-sold tmp-probe-url tuya vercel-relay vicare "
          for s in $LISTA; do
            extra=""
            if [[ "$NO_JWT" == *" $s "* ]]; then extra="--no-verify-jwt"; fi
            echo "::group::deploy $s $extra"
            # 03.11.2026: CLI-ul „latest” cere confirmare; fără terminal refuza („Nothing was changed”) → --yes explicit
            supabase functions deploy "$s" --project-ref dxczwkbciseqniprspcu $extra --yes
            echo "::endgroup::"
          done

      - name: Rezumat repo vs producție
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dxczwkbciseqniprspcu
        run: node scripts/verifica-edge-functions.mjs
