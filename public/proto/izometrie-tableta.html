<!DOCTYPE html>
<html lang="ro" data-theme="sun">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Izometrie · Tabletă teren — PontajPRO (PROTOTIP, date fictive)</title>
<style>
/* ===== tokeni: mapați 1:1 din G (src/App.jsx); abaterile pentru teren sunt tokeni separați (--fb, --key, --swOff) ===== */
:root{
 --bg:#0D1117;--surface:#161B22;--card:#1C2128;--card2:#21262D;--border:#21262D;--border2:#30363D;
 --fb:#6E7681;--key:#2D333B;--swOff:#6E7681;
 --text:#E6EDF3;--muted:#8B949E;--dim:#6E7681;
 --blue:#58A6FF;--primary:#1F6FEB;--primary2:#388BFD;--purple:#BC8CFF;--orange:#F0883E;--orangeBg:#3D2410;
 --green:#3FB950;--greenS:#238636;--greenBg:#1A3A1A;
 --red:#F85149;--redS:#DA3633;--redBg:#3A1A1A;
 --yfill:#D29922;--ybord:#D29922;--ytext:#D29922;--yellowBg:#3A2A0A;
 --blueBg:#12263F;--demoBg:rgba(188,140,255,.08);
 --glyph:#0D1117;--bw:1px;--shadow:0 8px 32px rgba(0,0,0,.5);--hdr:64px;--bh:84px;color-scheme:dark}
[data-theme=sun]{
 --bg:#EEF1F4;--surface:#FFFFFF;--card:#FFFFFF;--card2:#E6EAEF;--border:#B6BEC7;--border2:#8C959F;
 --fb:#424A53;--key:#E6EAEF;--swOff:#6E7681;
 --text:#06090D;--muted:#30363D;--dim:#4A525B;
 --blue:#0550AE;--primary:#0550AE;--primary2:#0969DA;--purple:#5B2FB0;--orange:#8A3300;--orangeBg:#FFE8D4;
 --green:#0E5A23;--greenS:#1A7F37;--greenBg:#D5F5DD;
 --red:#9F0C22;--redS:#C21D2B;--redBg:#FFE3E0;
 --yfill:#F5C400;--ybord:#B38600;--ytext:#000000;--yellowBg:#FFF2B8;
 --blueBg:#DCEBFF;--demoBg:rgba(91,47,176,.07);
 --glyph:#FFFFFF;--bw:2px;--shadow:0 6px 24px rgba(0,0,0,.22);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;background:none;border:0;padding:0;color:inherit}
.mono{font-family:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,"Roboto Mono",Menlo,monospace;letter-spacing:.3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.sm{font-size:16px}.b{font-weight:800}
.red{color:var(--red)}.grn{color:var(--green)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp{flex:1;min-width:0}
:focus-visible{outline:3px solid var(--primary2);outline-offset:2px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.lv{width:40px;height:40px;flex:none;display:block}

/* ===== butoane (raze: 10 controale, 14 carduri, 999 cipuri) ===== */
.btn{min-height:56px;padding:0 18px;border-radius:10px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid transparent;background:var(--card2);color:var(--text);line-height:1.15;text-align:center;transition:transform .06s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn-p{background:var(--primary);color:#fff}
.btn-s{background:var(--surface);border-color:var(--fb);color:var(--text)}
.btn-ok{background:var(--greenS);color:#fff}
.btn-red{background:var(--redS);color:#fff}
.btn-ro{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn-warn{background:var(--yfill);color:#000}
.btn-xl{min-height:72px;font-size:21px;padding:0 24px}
.btn[aria-disabled=true]{background:var(--card2);color:var(--muted);border:2px dashed var(--fb);filter:none}
.btn[aria-disabled=true]:active{transform:none}
.w100{width:100%}
.pbtn{min-height:68px;padding:6px 20px;max-width:64%;justify-content:flex-start}
.pbtn .i{width:30px;height:30px;stroke-width:2.8}
.pbtn .bl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.12;min-width:0}
.pbtn .l1{font-size:18px}
.pbtn .l2{font-size:18px;font-weight:600;white-space:nowrap}
.pbtn .pnr{font-size:28px;font-weight:800;letter-spacing:-.3px}
@media (orientation:landscape) and (max-height:820px){.pbtn{min-height:60px}.pbtn .pnr{font-size:26px}}

/* ===== banner prototip (doar demo — nu există în producție) ===== */
.demo{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 16px;background:var(--demoBg);border-bottom:1.5px dashed var(--purple);font-size:16px;flex-wrap:wrap}
.dtag{font-weight:800;color:var(--purple);letter-spacing:.6px;white-space:nowrap}
.dsub{color:var(--muted);white-space:nowrap}
.dbtn{min-height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--purple);color:var(--purple);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--surface)}
.dbtn .sw{width:38px;height:22px;border-radius:11px}
.dbtn .sw::after{top:3px;left:3px;width:16px;height:16px}
.dbtn.on{background:var(--orangeBg);border-color:var(--orange);color:var(--orange)}
.dbtn.on .sw{background:var(--orange)}.dbtn.on .sw::after{left:19px}
.ds{display:none}
@media(max-width:1099px){.dsub{display:none}}
@media(max-width:860px){.dl{display:none}.ds{display:inline}}

/* ===== bara de sus: un singur rând (identitate · tronson · sincronizare · temă) ===== */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:var(--bw) solid var(--border2)}
.bar{min-height:64px;display:flex;align-items:center;gap:12px;padding:4px 16px;flex-wrap:wrap}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#1F6FEB,#388BFD);display:grid;place-items:center;font-size:15px;flex:none;color:#fff}
.brand{font-weight:800;font-size:16px;letter-spacing:-.3px;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--muted);white-space:nowrap}
.crumb .exe{color:var(--blue)}
.crumb b{color:var(--text);font-weight:800}
.trbtn{min-height:56px;padding:4px 14px;border-radius:10px;border:2px solid var(--fb);background:var(--bg);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.1;text-align:left;flex:none}
.trbtn b{font-size:24px;font-weight:800;letter-spacing:-.3px}
.trbtn small{font-size:16px;color:var(--muted);font-weight:700;white-space:nowrap}
.trbtn small.w{color:var(--text);background:var(--yellowBg);border-radius:999px;padding:0 8px;margin-left:-8px}
.trbtn:active{transform:scale(.98)}
.syncg{display:flex;align-items:center;gap:10px;min-width:0}
.pill{display:flex;align-items:center;gap:10px;min-height:56px;padding:4px 14px 4px 8px;border-radius:10px;min-width:0}
.pill .pic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--glyph)}
.pill .pic .i{width:22px;height:22px;stroke-width:2.6}
.pill .ptx{min-width:0}
.pill b{display:block;font-size:18px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill small{display:block;font-size:16px;font-weight:600;color:var(--text);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.off{background:var(--orangeBg)}.pill.off .pic{background:var(--orange)}.pill.off b{color:var(--orange)}
.pill.ok{background:var(--greenBg)}.pill.ok .pic{background:var(--green)}.pill.ok b{color:var(--green)}
.pill.sync{background:var(--blueBg)}.pill.sync .pic{background:var(--primary);color:#fff}.pill.sync b{color:var(--blue)}
.seg{display:inline-flex;border:2px solid var(--fb);border-radius:10px;overflow:hidden;flex:none}
.seg button{min-height:52px;padding:0 14px;font-size:17px;font-weight:700;color:var(--text);background:var(--surface);display:inline-flex;align-items:center;gap:8px}
.seg button+button{border-left:2px solid var(--fb)}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.lw{display:inline}
@media(max-width:1359px){.brand,.crumb .exe,.crumb .sep{display:none}}
@media(max-width:1199px){.lw{display:none}.seg .i{display:none}}
@media(min-width:1000px) and (max-width:1199px){.crumb{display:none}}
@media(max-width:999px){.syncg{order:10;flex:1 1 100%}.syncg .pill{flex:1}}
.band{display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:18px;font-weight:700;border-top:2px solid;flex-wrap:wrap}
.band .lv{width:32px;height:32px}
.band--red{background:var(--redBg);border-color:var(--red)}
.band--yel{background:var(--yellowBg);border-color:var(--ybord)}
.band--red .lv{color:var(--red)}.band--yel .lv{color:var(--yfill);--glyph:#000}

/* ===== general ===== */
.wrap{max-width:1280px;margin:0 auto;padding:10px 16px calc(var(--bh) + 24px)}
.wrap--nobar{padding-bottom:40px}
.card{background:var(--surface);border:var(--bw) solid var(--border2);border-radius:14px;padding:16px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.3px;line-height:1.15}
h2{font-size:22px;font-weight:800;margin:0;line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:16px;font-weight:800;white-space:nowrap;background:var(--card2);color:var(--text)}
.chip.ok{background:var(--greenBg);color:var(--green)}
.chip.warn{background:var(--yellowBg);color:var(--ytext)}
.chip.info{background:var(--blueBg);color:var(--blue)}
.chip.red{background:var(--redBg);color:var(--red)}
.note{font-size:16px;color:var(--muted);margin-top:8px}
.hint{font-size:16px;color:var(--muted);margin:4px 0 0}
.lbl{font-size:16px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--border2);border-top-color:var(--primary2);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-4px;flex:none}
.spin.w{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.spin.big{width:56px;height:56px;border-width:6px;border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{border-color:var(--fb)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes skel{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.skel{height:72px;border-radius:10px;background:var(--card2);animation:skel 1.2s ease-in-out infinite}
.sw{width:56px;height:32px;border-radius:16px;background:var(--swOff);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}

/* ===== ecran start ===== */
.h1row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.proj{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.pic{width:56px;height:56px;border-radius:14px;background:var(--blueBg);display:grid;place-items:center;font-size:28px;flex:none}
.pname{font-size:24px;font-weight:800;line-height:1.2}
.gpsc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;border:2px solid var(--primary);margin-bottom:12px}
@media(max-width:900px){.gpsc{grid-template-columns:1fr}}
.gbig{font-size:32px;font-weight:800;line-height:1.2;margin:4px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gbig .blue{color:var(--blue)}
.gacts{display:flex;flex-direction:column;gap:10px}
.kmap{position:relative;display:flex;gap:4px;margin-top:10px;padding-top:26px}
.kseg{flex:1;min-width:0;min-height:56px;border-radius:10px;background:var(--card2);border:2px solid var(--border2);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.kseg small{font-size:16px;font-weight:700;color:var(--muted)}
.kseg.done{border-color:var(--green)}
.kseg.act{border-color:var(--ybord)}
.kseg.here{background:var(--blueBg);border-color:var(--primary);box-shadow:0 0 0 3px #388BFD55}
.kpin{position:absolute;top:0;transform:translateX(-50%);color:var(--blue);pointer-events:none}
.kpin .i{width:26px;height:26px;stroke-width:2.6}
.kticks{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);font-weight:700;margin-top:4px}
.trgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.trt{min-height:120px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--border2);display:flex;flex-direction:column;gap:4px;transition:transform .06s}
.trt:active{transform:scale(.98);border-color:var(--primary)}
.trt.here{border-color:var(--primary)}
.trc{font-size:30px;font-weight:800;letter-spacing:-.5px}
.trkm{font-size:17px;color:var(--muted);font-weight:600}
.trst{font-size:17px;font-weight:700}
.pband{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px solid var(--fb);background:var(--surface);margin-bottom:12px;flex-wrap:wrap;font-size:18px}
.pband.old{border-color:var(--ybord);background:var(--yellowBg)}
.pband .lv{width:34px;height:34px;color:var(--yfill);--glyph:#000}
.pband .ic2{color:var(--blue)}

/* ===== ecran lucru ===== */
.work{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media(min-width:1000px){
 .work{grid-template-columns:minmax(0,1fr) clamp(400px,38vw,490px)}
 .listcol{position:sticky;top:calc(var(--hdr) + 10px);max-height:calc(100vh - var(--hdr) - var(--bh) - 22px);overflow:auto;padding-right:4px;overscroll-behavior:contain}
}
.form{padding:0;overflow:hidden}
.edband{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--yellowBg);border-bottom:3px solid var(--ybord);flex-wrap:wrap}
.edband b{font-size:21px;color:var(--ytext)}
.step{padding:10px 16px;border-top:var(--bw) solid var(--border2);scroll-margin-top:calc(var(--hdr) + 10px);scroll-margin-bottom:calc(var(--bh) + 10px)}
.step:first-child,.edband+.step{border-top:0}
.slabel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;font-weight:800;margin-bottom:10px}
.sn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.sn.done{background:var(--greenS)}
.sn.err{background:var(--redS);color:#fff}
.sn.warn{background:var(--yfill);color:#000}
.sn.off{background:var(--card2);color:var(--muted);border:2px solid var(--fb)}
.dimstep .slabel{margin-bottom:0;color:var(--muted)}
.s1row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.nrctl{display:flex;align-items:center;gap:8px}
.sq{width:60px;min-width:60px;height:64px;font-size:34px;padding:0}
.nrbox{height:64px;padding:0 12px;border-radius:10px;background:var(--bg);border:2px solid var(--fb);display:inline-flex;align-items:center;gap:2px;line-height:1;transition:transform .06s}
.nrbox:active{transform:scale(.98)}
.nrp{color:var(--muted);font-weight:800}
.nrbox .nrp{font-size:22px}
.nrd{font-size:34px;font-weight:800}
.nre{margin-left:6px;color:var(--blue);width:22px;height:22px}
.nrbox.bad{border-color:var(--red);background:var(--redBg)}
.s1info{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:16px;color:var(--muted);min-width:0;flex:1 1 150px}
@media(min-width:1000px){.s1x{display:none}}
.s1info b{color:var(--text)}
#lastw{display:block;border-radius:10px;padding:0 4px;margin-left:-4px;line-height:1.3}
.kp2{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;align-items:start}
.kpr{min-width:0}
.kpr .slabel{margin-bottom:8px;flex-wrap:nowrap}
.kalt{margin-top:14px;width:232px}
.kp{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.key{height:64px;border-radius:10px;background:var(--key);border:2px solid var(--fb);font-size:32px;font-weight:800;color:var(--text);display:grid;place-items:center;transition:transform .05s}
.key .i{width:34px;height:34px;stroke-width:2.2}
.key.fn{font-size:34px}
.key.blank{visibility:hidden}
.key:active{transform:scale(.94);background:var(--primary);border-color:var(--primary);color:#fff}
.serbox{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--primary);box-shadow:0 0 0 3px #1F6FEB33;border-radius:14px;padding:8px 10px;min-height:76px}
.pref{font-size:25px;font-weight:800;color:var(--muted)}
.slot{width:44px;height:58px;flex:none;border-radius:10px;border:2px solid var(--fb);display:grid;place-items:center;font-size:36px;font-weight:800;background:var(--surface)}
.slot.fill{border-color:var(--primary)}
.slot.cur{border-color:var(--primary2);animation:blink 1.1s steps(2,start) infinite}
.prefs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.freein{flex:1;min-width:0;height:58px;border:0;background:transparent;font-size:30px;font-weight:800;outline:none;text-transform:uppercase}
.freein::placeholder{color:var(--dim);font-weight:600}
.sugg{display:flex;flex-direction:column;gap:14px;margin-top:12px;min-width:0}
.sghead{font-size:16px;font-weight:800;color:var(--muted)}
.srow{min-height:64px;padding:6px 14px;border-radius:10px;background:var(--card);border:2px solid var(--fb);text-align:left;display:flex;align-items:center;gap:12px;justify-content:space-between;transition:transform .05s;width:100%}
.srow:active{transform:scale(.98);border-color:var(--primary)}
.srow.used{border-style:dashed;border-color:var(--border2);background:transparent;cursor:default}
.srow.used:active{transform:none}
.sl{display:flex;flex-direction:column;gap:2px;min-width:0}
.sser{font-size:24px;font-weight:700;line-height:1.1}
.sser .pm{color:var(--muted)}
.sser mark{background:none;color:var(--blue);font-weight:900;text-decoration:underline;text-underline-offset:4px}
.sr{display:flex;flex-direction:column;align-items:flex-end;font-size:16px;color:var(--muted);white-space:nowrap}
.sr b{font-size:24px;color:var(--text)}
.bdg{font-size:16px;font-weight:700;padding:2px 10px;border-radius:999px;min-height:28px;display:inline-flex;align-items:center;align-self:flex-start;white-space:nowrap}
.bdg.grn{background:var(--greenBg);color:var(--green)}
.bdg.yel{background:var(--yellowBg);color:var(--ytext)}
.bdg.red{background:var(--redBg);color:var(--red);font-weight:800}
.sempty{padding:14px 16px;border-radius:10px;border:2px dashed var(--border2);color:var(--muted);font-size:17px}
.sempty b{color:var(--text)}
.sempty.bad{border-color:var(--red);color:var(--text);background:var(--redBg)}
.stk{margin-top:12px;font-size:16px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.3}
.stk .i{margin-top:2px}
.stk.old{color:var(--text);background:var(--yellowBg);border:2px solid var(--ybord);border-radius:10px;padding:8px 10px}
.selrow{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.selrow>.btn{padding:0 12px}
.selser{font-size:24px;font-weight:800;line-height:1;white-space:nowrap}
.selser .pfx{color:var(--muted)}
.selser b{font-size:48px;letter-spacing:1px}
.selsar{display:flex;flex-direction:column;line-height:1.15}
.selsar b{font-size:26px}
.cmp{font-size:16px;color:var(--muted);font-weight:600}
.al{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:12px 14px;border:2px solid;margin-top:12px;color:var(--text)}
.alb{flex:1;min-width:0}
.al .t{font-size:20px;font-weight:800;line-height:1.2}
.al .m{font-size:18px;margin-top:2px}
.aact{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.al.compact{padding:8px 12px;align-items:center}
.al.compact .lv{width:32px;height:32px}

function hm(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fT(s){if(!s)return '—';var d=new Date(s),t=new Date(),y=new Date(t.getTime()-864e5);if(dKey(d)===dKey(t))return hm(d);if(dKey(d)===dKey(y))return 'ieri '+hm(d);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+' '+hm(d);}
function fD(s){var d=new Date(s);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1);}
function isToday(s){return dKey(new Date(s))===dKey(new Date());}
function ageH(s){return (Date.now()-new Date(s).getTime())/36e5;}
var AZI=new Date().toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric'});
function kmFmt(km){var k=Math.floor(km+1e-9);return k+'+'+pad3(Math.round((km-k)*1000));}
function trFromKm(km){if(km<49||km>89)return null;return TRS[Math.min(TRS.length-1,Math.floor((km-49)/5))].cod;}
function trObj(c){for(var i=0;i<TRS.length;i++)if(TRS[i].cod===c)return TRS[i];return TRS[1];}
function distEdge(km){var t=trObj(trFromKm(km));return Math.min(km-t.a,t.b-km);}
function parseLen(s){if(!s)return NaN;return parseFloat(String(s).replace(',','.'));}
function pl(n,s,p){if(n===1)return '1 '+s;var r=n%100;return n+((r>=20||(r===0&&n>0))?' de ':' ')+p;}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);}
function normSer(s){return String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'');}
function uuid(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}return 'u-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function lv(n,cls){return '<svg class="lv'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#lv-'+n+'"/></svg>';}
function sarjaTxt(s){return s==='?'?'sarjă nedeclarată':s||'—';}

/* ---------------- date demo ---------------- */
function newDraft(tr,prefix){return {editId:null,touched:false,tr:tr,nr:1,nrAuto:true,insert:false,prefix:prefix||'254CA10',digits:'',free:false,freeTxt:'',checked:false,sel:null,lmode:'stoc',len:'',restMode:'deseu',verif:false,usarja:'',ulen:''};}
function seed(){
  var st=[],seq=0,T=new Date();
  function at(h,m,off){var d=new Date(T);d.setDate(d.getDate()+(off||0));d.setHours(h,m,0,0);return d.toISOString();}
  function add(serie,sarja,lung,o){var it={id:'p'+(++seq),serie:serie,sarja:sarja,lung:lung,tip:'teava',stare:'disponibil',loc:null,mont:null,orig:null,origLung:null,origMont:null,local:false,lock:null};if(o)for(var k in o)it[k]=o[k];st.push(it);return it;}
  // țevi întregi disponibile în stocul LOT 2 Jupânești
  [['254CA10206','TA01575',12.47],['254CA10229','TA01575',12.33],['254CA10273','TA01575',12.50],['254CA10302','SA07348',12.44],
   ['254CA10406','SA08018',12.36],['254CA10441','SA08018',12.29],['254CA10503','SA08018',12.47],['254CA10558','SA08018',12.35]]
   .forEach(function(r){add(r[0],r[1],r[2]);});
  // TR12 (aprobat): o serie montată integral + două țevi tăiate, cu cupoanele lor în stoc
  add('254CA10287','TA01575',12.41,{stare:'montat',loc:'TR12S045',mont:12.41});
  add('254CA10348','SA07348',12.38,{stare:'montat',loc:'TR12S031',mont:9.18});
  add('254CA10419','SA08018',12.19,{stare:'montat',loc:'TR12S038',mont:7.85});
  add('254CA10348','SA07348',3.20,{tip:'cupon',orig:'TR12S031',origLung:12.38,origMont:9.18});
  add('254CA10419','SA08018',4.34,{tip:'cupon',orig:'TR12S038',origLung:12.19,origMont:7.85});
  // sesiunea de azi pe TR13 (lucrată fără semnal de dimineață) — orele sunt fixe după 11:15, altfel relative
  var mins=T.getHours()*60+T.getMinutes(),fixed=mins>=11*60+15;
  var ore=[[8,12],[8,41],[9,5],[9,37],[10,2],[10,29],[10,55]];
  function tAt(i){if(fixed)return at(ore[i][0],ore[i][1]);return new Date(T.getTime()-(20+27*(6-i))*60000).toISOString();}
  var lastSync=fixed?at(7,45):new Date(T.getTime()-(20+27*7)*60000).toISOString();
  var ses=[['254CA10211','TA01575',12.38],['254CA10234','TA01575',12.45],['254CA10258','TA01575',12.09],
           ['254CA10315','SA07348',12.50,8.00],['254CA10371','SA07348',12.26],['254CA10392','SA07348',12.31],['254CA10437','SA08018',12.42]];
  var welds=[],outbox=[],oseq=0;
  ses.forEach(function(r,i){
    var nr=41+i,loc=nrStr('TR13',nr),mont=r[3]||r[2];
    var it=add(r[0],r[1],r[2],{stare:'montat',loc:loc,mont:mont}),cuponId=null;
    if(r[3]){var c=add(r[0],r[1],round2(r[2]-r[3]),{tip:'cupon',orig:loc,origLung:r[2],origMont:r[3],local:true});cuponId=c.id;}
    var w={id:'w'+(++seq),uuid:uuid(),tr:'TR13',nr:nr,serie:r[0],sarja:r[1],lungStoc:r[2],lungMont:mont,taiata:!!r[3],stockId:it.id,cuponId:cuponId,tipPiesa:'teava',alert:null,corr:null,deseu:null,srv:false,stare:'sesiune',creat:tAt(i),modif:null,lot:null};
    welds.push(w);outbox.push({seq:++oseq,op:'upsert',id:w.id,uuid:w.uuid,nr:loc});
  });
  // sesiune uitată de ieri pe TR14 — sincronizată ca ciornă, dar netrimisă la aprobare
  [['254CA10520','SA08018',12.38,[15,10]],['254CA10544','SA08018',12.42,[15,42]]].forEach(function(r,i){
    var nr=1+i,loc=nrStr('TR14',nr),it=add(r[0],r[1],r[2],{stare:'montat',loc:loc,mont:r[2]});
    welds.push({id:'w'+(++seq),uuid:uuid(),tr:'TR14',nr:nr,serie:r[0],sarja:r[1],lungStoc:r[2],lungMont:r[2],taiata:false,stockId:it.id,cuponId:null,tipPiesa:'teava',alert:null,corr:null,deseu:null,srv:true,stare:'sesiune',creat:at(r[3][0],r[3][1],-1),modif:null,lot:null});
  });
  // istoricul proiectului (TR12 S001–S052, TR13 S001–S040) — țevi montate care nu mai sunt în stoc
  var used={999:1};st.forEach(function(it){used[it.serie.slice(-3)]=1;});
  var hist=[],k=0,cands=[];
  for(var j=0;j<361;j++){var n=200+((j*37)%361);if(!used[n])cands.push(n);}
  function hpush(tr,nr,dt){var n=cands[k++];hist.push({serie:'254CA10'+pad3(n),sarja:n<300?'TA01575':n<400?'SA07348':'SA08018',lung:round2(12.09+((k*13)%42)/100),loc:nrStr(tr,nr),data:dt});}
  for(var a=1;a<=52;a++)if(a!==31&&a!==38&&a!==45)hpush('TR12',a,HIST.TR12.data);
  for(var b=1;b<=40;b++)hpush('TR13',b,HIST.TR13.data);
  return {v:VER,theme:'sun',online:false,lastSync:lastSync,stocCache:lastSync,screen:'start',tr:'TR13',gps:0,gpsAck:null,gpsAsked:{},
          stock:st,hist:hist,welds:welds,subs:[],outbox:outbox,oseq:oseq,seq:seq,lastLot:null,verifBlocks:false,draft:newDraft('TR13')};
}

/* ---------------- persistență (cu semnalizare de erori) ---------------- */
var UI={modal:null,syncing:null,inflight:null,syncT:null,autoT:null,toast:null,toastT:null,undo:null,undoAt:0,fx:[],scrollTo:null,focus:null,
        persistErr:false,loadMsg:null,boot:true,otherTab:false,simFail:false,tapGuard:0,lp:null,lpFired:false,lastScreen:null};
function load(){
  var raw=null;
  try{raw=localStorage.getItem(LS_KEY);}catch(e){UI.loadMsg='Memoria tabletei nu poate fi citită (mod privat?) — datele nu rămân după închidere.';return null;}
  if(!raw)return null;
  try{
    var o=JSON.parse(raw);
    if(!o||o.v!==VER||!Array.isArray(o.welds)||!Array.isArray(o.stock)||!Array.isArray(o.outbox)||!o.draft)throw new Error('format');
    return o;
  }catch(e){
    var k=LS_KEY+'_corupt_'+Date.now();
    try{localStorage.setItem(k,raw);}catch(e2){k=null;}
    UI.loadMsg='Datele salvate pe tabletă nu au putut fi citite'+(k?' — am păstrat o copie de siguranță ('+k+')':'')+'. Am pornit cu datele demo, fără să suprascriu nimic altceva.';
    return null;
  }
}
function persist(){
  try{if(UI.simFail)throw new Error('sim');localStorage.setItem(LS_KEY,JSON.stringify(S));UI.persistErr=false;}
  catch(e){UI.persistErr=true;}
}
var S=load()||seed();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function nid(){return 'x'+(++S.seq);}

/* ---------------- logică ---------------- */
function editW(){return S.draft.editId?findW(S.draft.editId):null;}
function findW(id){for(var i=0;i<S.welds.length;i++)if(S.welds[i].id===id)return S.welds[i];return null;}
function findP(id){for(var i=0;i<S.stock.length;i++)if(S.stock[i].id===id)return S.stock[i];return null;}
function findLot(id){for(var i=0;i<S.subs.length;i++)if(S.subs[i].id===id)return S.subs[i];return null;}
function findWByLoc(loc){for(var i=0;i<S.welds.length;i++){var w=S.welds[i];if(nrStr(w.tr,w.nr)===loc)return w;}return null;}
function isAvail(it,ew){if(it.lock)return false;return it.stare==='disponibil'||(!!ew&&ew.stockId===it.id);}
function hidden(it,ew){return !!ew&&ew.cuponId===it.id;}
function sesWelds(tr){return S.welds.filter(function(w){return w.tr===tr&&w.stare==='sesiune';});}
function nextNr(tr,exceptId){var m=(HIST[tr]||{max:0}).max;S.welds.forEach(function(w){if(w.tr===tr&&w.id!==exceptId&&w.nr>m)m=w.nr;});return m+1;}
function nrTaken(tr,nr,exceptId){
  var h=HIST[tr];if(h&&nr>=1&&nr<=h.max)return {kind:'hist',txt:'aprobată anterior ('+h.data+')'};
  for(var i=0;i<S.welds.length;i++){var w=S.welds[i];if(w.tr===tr&&w.nr===nr&&w.id!==exceptId)return {kind:w.stare,w:w,txt:(w.stare==='trimis'?'trimisă la aprobare':'înregistrată în sesiune')+' · '+fT(w.creat)+' · '+w.serie};}
  return null;
}
/* „sudură uitată”: rândul continuu de suduri netrimise care se mută cu +1 */
function insPlan(tr,nr,exceptId){
  var h=(HIST[tr]||{max:0}).max;if(nr<=h)return null;
  var run=[],n=nr;
  while(true){var t=nrTaken(tr,n,exceptId);if(!t)break;if(!t.w||t.w.stare!=='sesiune')return null;run.push(t.w);n++;}
  return run.length?run:null;
}
function prevWeld(tr,nr,exceptId){var p=null;S.welds.forEach(function(w){if(w.tr===tr&&w.id!==exceptId&&w.nr<nr&&(!p||w.nr>p.nr))p=w;});return p;}
function cuponUsed(w){if(!w.cuponId)return null;var c=findP(w.cuponId);return c&&c.stare==='montat'?c.loc:null;}
function dirty(){var d=S.draft;if(d.editId)return !!d.touched;return !!(d.digits||d.sel||(d.free&&normSer(d.freeTxt)));}
function gpsNow(){var g=GPS[S.gps]||GPS[0];if(g.km==null)return {st:g.st};return {km:g.km,tr:trFromKm(g.km),edge:trFromKm(g.km)?distEdge(g.km):0};}
function gpsMismatch(){var g=gpsNow();return !!(g.tr&&g.tr!==S.tr&&g.edge>GPS_TOL&&S.gpsAck!==S.tr+'|'+S.gps&&!S.draft.editId);}
function stockStale(){return ageH(S.stocCache)>STOC_VECHI_H;}
function prefixes(){var m={};S.stock.forEach(function(it){if(it.stare==='disponibil'&&!it.lock&&it.serie.length===10)m[it.serie.slice(0,7)]=1;});return Object.keys(m).sort();}

function normalize(){
  var d=S.draft;
  if(d.editId){var ew=editW();if(!ew||ew.stare!=='sesiune')S.draft=newDraft(S.tr,d.prefix);}
  if(S.draft.tr!==S.tr&&!S.draft.editId)S.draft=newDraft(S.tr,S.draft.prefix);
  d=S.draft;
  if(d.insert&&!insPlan(d.tr,d.nr,d.editId))d.insert=false;
  if(d.nrAuto&&!d.editId&&!d.insert)d.nr=nextNr(d.tr);
  if(UI.undo&&Date.now()-UI.undo.t>120000)UI.undo=null;
}

function evalDraft(){
  var d=S.draft,ew=editW(),r={};
  r.nrTxt=nrStr(d.tr,d.nr);r.next=nextNr(d.tr,d.editId);
  r.taken=nrTaken(d.tr,d.nr,d.editId);
  r.canIns=(r.taken&&r.taken.w&&r.taken.w.stare==='sesiune'&&!d.editId)?insPlan(d.tr,d.nr,d.editId):null;
  r.insPlan=null;
  if(d.insert&&r.canIns){r.insPlan=r.canIns;r.taken=null;}
  r.gap=(!d.editId&&!r.taken&&!r.insPlan&&d.nr>r.next)?[r.next,d.nr-1]:null;
  var q=d.free?normSer(d.freeTxt):d.prefix+d.digits;r.q=q;r.fmtOk=FMT.test(q);
  r.complete=!!d.sel||(d.free?(d.checked&&r.fmtOk):d.digits.length===3);
  r.status='none';r.ready=false;
  if(!r.complete)return r;
  var item=d.sel?findP(d.sel):null;
  if(item&&!isAvail(item,ew))item=null;
  var serie=item?item.serie:q;r.serie=serie;
  var all=S.stock.filter(function(it){return it.serie===serie&&!hidden(it,ew);});
  if(!item){
    var av=all.filter(function(it){return isAvail(it,ew);}).sort(function(a,b){return ((a.tip==='teava'?0:1)-(b.tip==='teava'?0:1))||(b.lung-a.lung);});
    item=av[0]||null;
  }
  if(item){
    r.item=item;r.status=item.tip==='cupon'?'info':'ok';
    var lm=d.lmode;
    if(lm==='taiata'||lm==='difera'){
      var lv=parseLen(d.len);r.lenVal=lv;
      if(!d.len||isNaN(lv)||lv<=0)r.lenState='empty';
      else if(lv<0.1)r.lenState='mic';
      else if(lm==='taiata'&&lv>=item.lung-0.004)r.lenState='mare';
      else if(lm==='difera'&&lv>MAXL)r.lenState='mare';
      else if(lm==='difera'&&Math.abs(lv-item.lung)<0.005)r.lenState='egal';
      else{r.lenState='ok';if(lm==='taiata'){r.rest=round2(item.lung-lv);r.mic=r.rest<MIN_CUPON;r.cupon=!r.mic||d.restMode==='cupon';}}
    }
    r.ready=lm==='stoc'||r.lenState==='ok';
    return r;
  }
  // seria nu are nicio bucată disponibilă: e montată (stoc / istoric / altă tabletă) sau nu există
  var locs=[];
  all.forEach(function(it){if(!isAvail(it,ew))locs.push({loc:it.lock||it.loc,lung:it.mont||it.lung,sarja:it.sarja,tip:it.tip,src:it.lock?'server':'stoc'});});
  S.hist.forEach(function(h){if(h.serie===serie)locs.push({loc:h.loc,lung:h.lung,sarja:h.sarja,tip:'teava',src:'istoric',data:h.data});});
  if(locs.length){
    r.status='block';r.locs=locs;r.sarja=locs[0].sarja;
    for(var i=0;i<locs.length;i++){var cw=findWByLoc(locs[i].loc);if(cw&&cw.stare==='sesiune'&&cw.id!==d.editId){r.confW=cw;break;}}
    return r;
  }
  var dup=null;S.welds.forEach(function(w){if(!dup&&w.serie===serie&&w.id!==d.editId)dup=w;});
  if(dup){r.status='block';r.locs=[{loc:nrStr(dup.tr,dup.nr),src:'verif'}];r.confW=dup.stare==='sesiune'?dup:null;return r;}
  r.status='unknown';
  var uv=parseLen(d.ulen);r.ulenVal=uv;
  r.ulenState=(!d.ulen||isNaN(uv)||uv<=0)?'empty':uv<0.1?'mic':uv>MAXL?'mare':'ok';
  r.ready=d.verif&&!!d.usarja&&r.ulenState==='ok';
  return r;
}
function locSuffix(c){
  if(c.src==='server'){var s=SERVER_MONTAT.filter(function(x){return x.loc===c.loc;})[0];return ' ('+(s?s.cine+', '+s.ora:'altă tabletă')+')';}
  if(c.src==='istoric')return ' (aprobată '+c.data+')';
  if(c.src==='verif')return ' (în verificare)';
  var w=findWByLoc(c.loc);
  if(w)return w.stare==='trimis'?' (trimisă la aprobare)':' (sesiunea '+(isToday(w.creat)?'de azi':'din '+fD(w.creat))+')';
  var t=trOf(c.loc);if(HIST[t])return ' (aprobată)';
  return '';
}
function blockMsg(locs,serie){
  if(locs.length===1){var c=locs[0];
    if(c.src==='verif')return 'Seria <b class="mono">'+esc(serie)+'</b> e deja înregistrată pe <b>'+c.loc+'</b> (în verificare) — nu se poate folosi de două ori.';
    return 'Aceeași serie + sarjă + lungime există deja pe <b>'+c.loc+'</b>'+locSuffix(c)+' — nu se poate folosi; pachetul de lansare nu se poate genera.';}
  return 'Seria e deja montată integral: '+locs.map(function(c){return '<b>'+c.loc+'</b> · '+(c.tip==='cupon'?'cupon ':'')+fmtM(c.lung)+' m';}).join('; ')+' — nu se poate folosi; pachetul de lansare nu se poate genera.';
}

/* ---------------- coadă de sincronizare (outbox ordonat, idempotent prin UUID) ---------------- */
function enq(op,o){
  var inf=UI.inflight;
  if(op==='upsert'||op==='delete')S.outbox=S.outbox.filter(function(e){return !(e.op==='upsert'&&e.id===o.id&&!(inf&&inf.seq===e.seq));});
  if(op==='upsert')S.outbox.push({seq:++S.oseq,op:'upsert',id:o.id,uuid:o.uuid,nr:nrStr(o.tr,o.nr)});
  else if(op==='delete'){if(o.srv||(inf&&inf.id===o.id))S.outbox.push({seq:++S.oseq,op:'delete',id:o.id,uuid:o.uuid,nr:nrStr(o.tr,o.nr)});}
  else if(op==='submit')S.outbox.push({seq:++S.oseq,op:'submit',id:o.id});
}
function syncOf(w){
  if(w.alert&&w.alert.lvl==='conflict')return 'conflict';
  if(UI.inflight&&UI.inflight.id===w.id)return 'sending';
  for(var i=0;i<S.outbox.length;i++)if(S.outbox[i].id===w.id)return w.srv?'modif':'pending';
  return w.srv?'ok':'pending';
}
function lotSync(l){
  if(l.sync==='respins')return 'respins';
  if(UI.inflight&&UI.inflight.op==='submit'&&UI.inflight.id===l.id)return 'sending';
  for(var i=0;i<S.outbox.length;i++)if(S.outbox[i].op==='submit'&&S.outbox[i].id===l.id)return 'pending';
  return 'ok';
}

function release(w){
  if(w.stockId){var it=findP(w.stockId);if(it){if(it.lock){it.stare='montat';it.loc=it.lock;it.mont=it.lung;}else{it.stare='disponibil';it.loc=null;it.mont=null;}}}
  if(w.cuponId){S.stock=S.stock.filter(function(x){return x.id!==w.cuponId;});}
}
function relocate(o,n){S.stock.forEach(function(it){if(it.loc===o)it.loc=n;if(it.orig===o)it.orig=n;});}
function snap(label,short){UI.undo={label:label,short:short,t:Date.now(),data:JSON.stringify({stock:S.stock,welds:S.welds,draft:S.draft})};}
function sig(w){return [w.nr,w.serie,w.sarja,w.lungMont,w.alert?w.alert.lvl:'',w.stockId,w.cuponId].join('|');}

function saveWeld(kind){
  var d=S.draft,r=evalDraft(),ew=editW();
  if(r.taken){buzz('err');fx('#al-nr','shake');say('Numărul '+r.nrTxt+' e ocupat — alege alt număr','err');UI.scrollTo='st1';return;}
  if(kind==='ok'&&!(r.status==='ok'||r.status==='info'))return;
  if(kind==='ok'&&!r.ready){buzz('err');fx('#lendisp','shake');return;}
  if(kind==='block'&&r.status!=='block')return;
  if(kind==='verif'&&(r.status!=='unknown'||!r.ready)){buzz('err');fx('#ulendisp','shake');return;}
  var loc=nrStr(d.tr,d.nr),short='S'+pad3(d.nr);
  snap(ew?'modificarea '+loc:'salvarea '+loc,short);
  if(r.insPlan){r.insPlan.slice().sort(function(a,b){return b.nr-a.nr;}).forEach(function(x){var o=nrStr(x.tr,x.nr);x.nr++;relocate(o,nrStr(x.tr,x.nr));if(x.stare==='sesiune')enq('upsert',x);});}
  if(ew)release(ew);
  var w=ew||{id:nid(),uuid:uuid(),tr:d.tr,creat:iso(),stare:'sesiune',lot:null,srv:false,modif:null};
  w.nr=d.nr;w.cuponId=null;w.stockId=null;w.taiata=false;w.alert=null;w.corr=null;w.deseu=null;
  if(kind==='ok'){
    var it=r.item;it.stare='montat';it.loc=loc;
    if(d.lmode==='taiata'){
      it.mont=round2(r.lenVal);w.taiata=true;

function sumar(list){
  var r={n:list.length,metri:0,cupF:0,cupoane:[],mCup:0,deseu:[],block:[],verif:[],mVerif:0,info:[],corr:[]};
  list.forEach(function(w){
    var lvl=w.alert&&w.alert.lvl;
    if(lvl==='block'||lvl==='conflict'){r.block.push(w);return;}
    if(lvl==='verif'){r.verif.push(w);r.mVerif+=w.lungMont||0;return;}
    r.metri+=w.lungMont||0;
    if(w.tipPiesa==='cupon'){r.cupF++;r.info.push(w);}
    if(w.taiata&&w.cuponId){r.cupoane.push(w);r.mCup+=w.lungStoc-w.lungMont;}
    if(w.deseu)r.deseu.push(w);
    if(w.corr)r.corr.push(w);
  });
  r.metri=round2(r.metri);r.mCup=round2(r.mCup);r.mVerif=round2(r.mVerif);return r;
}
function gapsFor(tr){

  S.welds.forEach(function(w){if(w.tr===tr){nums[w.nr]=1;if(w.nr>mx)mx=w.nr;}});
  for(var n=h+1;n<mx;n++)if(!nums[n])g.push(n);
  return g;
}
function submitBlock(sm){

  S.subs.push(lot);enq('submit',lot);S.lastLot=lot.id;S.screen='trimis';UI.scrollTo='top';UI.undo=null;UI.toast=null;

function retract(id){

/* ---------------- sincronizare simulată (în ordinea operațiilor) ---------------- */
function stopSync(){clearTimeout(UI.syncT);UI.syncing=null;UI.inflight=null;}
function scheduleAuto(delay){
  clearTimeout(UI.autoT);
  if(S.online&&!UI.syncing&&S.outbox.length)UI.autoT=setTimeout(function(){startSync(false);},delay||1400);
}
function applyServerLocks(){
  SERVER_MONTAT.forEach(function(s){S.stock.forEach(function(it){if(it.serie===s.serie&&it.tip==='teava'&&it.stare==='disponibil'){it.stare='montat';it.loc=s.loc;it.lock=s.loc;it.mont=it.lung;}});});
}
function refreshStock(){S.lastSync=iso();S.stocCache=S.lastSync;S.stock.forEach(function(s){s.local=false;});applyServerLocks();}
function startSync(manual){
  if(!S.online){if(manual){buzz('err');fx('#strip','shake');say('Fără semnal — nimic nu se pierde: înregistrările stau pe tabletă și pleacă automat când revine semnalul.','off');render();}return;}
  if(UI.syncing)return;
  clearTimeout(UI.autoT);
  if(!S.outbox.length){refreshStock();if(manual){buzz('ok');say('✓ Totul e deja pe server · stoc actualizat '+hm(new Date()),'ok');}render();return;}
  UI.syncing={done:0,total:S.outbox.length,conf:0};render();
  UI.syncT=setTimeout(step,450);
}
function step(){
  if(!S.online||!UI.syncing){UI.inflight=null;return;}
  var e=S.outbox[0];
  if(!e){finishSync();return;}
  UI.inflight=e;render();
  UI.syncT=setTimeout(function(){
    if(!S.online||!UI.syncing){UI.inflight=null;render();return;}
    process(e);
    S.outbox=S.outbox.filter(function(x){return x.seq!==e.seq;});
    UI.inflight=null;UI.syncing.done++;UI.syncing.total=Math.max(UI.syncing.total,UI.syncing.done+S.outbox.length);
    step();
  },320);
}
function process(e){
  if(e.op==='upsert'){
    var w=findW(e.id);if(!w)return;
    var c=null,loc=nrStr(w.tr,w.nr);
    SERVER_MONTAT.forEach(function(s){if(!c&&s.serie===w.serie&&s.loc!==loc)c=s;});
    if(c&&w.tipPiesa!=='blocat'){
      w.alert={lvl:'conflict',loc:c.loc,cine:c.cine,ora:c.ora};
      var it=findP(w.stockId);if(it)it.lock=c.loc;
      if(w.cuponId){var cp=findP(w.cuponId);if(cp)cp.lock=c.loc;}
      UI.syncing.conf++;
    } else w.srv=true;
  } else if(e.op==='submit'){
    var l=findLot(e.id);if(!l)return;
    var bad=S.welds.filter(function(x){return x.lot===l.id&&x.alert&&x.alert.lvl==='conflict';});
    if(bad.length){l.sync='respins';l.motiv=bad.map(function(x){return nrStr(x.tr,x.nr);}).join(', ');S.welds.forEach(function(x){if(x.lot===l.id){x.stare='sesiune';x.lot=null;}});}
    else l.sync='ok';
  }
}
function finishSync(){
  var conf=UI.syncing?UI.syncing.conf:0,n=UI.syncing?UI.syncing.done:0;
  UI.syncing=null;UI.inflight=null;refreshStock();
  if(conf){buzz('err');say(pl(conf,'conflict','conflicte')+' la sincronizare — sudura e marcată cu roșu; alege altă țeavă','err');}
  else{buzz('ok');if(!UI.undo)say('✓ Sincronizat '+hm(new Date())+' — '+pl(n,'înregistrare trimisă','înregistrări trimise')+' pe server','ok');}
  render();scheduleAuto();
}

     '<div class="gacts"><button class="btn btn-p btn-xl" data-act="go-tr" data-tr="'+g.tr+'">Lucrează pe '+g.tr+ic('arrow')+'</button>'+alt+'</div></section>';}

function vSugg(r){
  if(UI.boot)return '<div class="sghead">Se încarcă stocul de pe tabletă…</div><div class="skel"></div><div class="skel"></div>';
  var d=S.draft,ew=editW(),q=r.q,typed=d.free?q.length:d.digits.length;

  var list=S.stock.filter(function(it){return !hidden(it,ew)&&(d.free?it.serie.indexOf(q)>=0:it.serie.indexOf(q)===0);});
  function rank(it){return isAvail(it,ew)?(it.tip==='teava'?0:1):2;}
  list.sort(function(a,b){return rank(a)-rank(b)||a.serie.localeCompare(b.serie);});

    var ser='<span class="pm">'+esc(it.serie.slice(0,i0))+'</span><mark>'+esc(it.serie.slice(i0,i1))+'</mark>'+esc(it.serie.slice(i1));
    var b=!av?'<span class="bdg red">MONTATĂ · '+(it.lock||it.loc)+'</span>':it.tip==='cupon'?'<span class="bdg yel">CUPON din '+it.orig+'</span>':'<span class="bdg grn">ÎN STOC</span>';
    var inner='<span class="sl"><span class="mono sser">'+ser+'</span>'+b+'</span><span class="sr"><b class="num">'+fmtM(it.lung)+' m</b><span>sarja '+it.sarja+'</span></span>';
    return av?'<button class="srow" data-act="pick" data-id="'+it.id+'">'+inner+'</button>':'<div class="srow used" aria-disabled="true" title="Informativ — țeava e deja montată">'+inner+'</div>';
  }).join('')+(tot>3?'<div class="muted sm">+'+(tot-3)+' — tastează încă o cifră</div>':'');
}

function vForm(r){
  var d=S.draft,ew=editW(),h='';
  if(ew)h+='<div class="edband">'+ic('edit')+'<div class="sp"><b>Editezi sudura '+nrStr(ew.tr,ew.nr)+'</b><div class="sm">După salvare se retrimite la sincronizare.</div></div><button class="btn btn-s" data-act="edit-cancel">Renunță la editare</button></div>';
  h+=vStep1(r)+vStep2(r);
  if(r.status==='ok'||r.status==='info')h+=vLen(r);
  else if(r.status==='unknown'&&d.verif)h+=vVerif(r);
  else if(!r.complete)h+='<div class="step dimstep"><div class="slabel"><span class="sn off">3</span>Verifică lungimea <span class="sm">— apare după ce alegi seria</span></div></div>';
  return h;
}
function cardNote(w){
  var a=w.alert,out=[];
  if(a&&a.lvl==='conflict')out.push({k:'red',t:'Conflict: montată și pe '+a.loc+' ('+a.cine+', '+a.ora+')'});
  else if(a&&a.lvl==='block')out.push({k:'red',t:'Blocant: serie deja montată pe '+(a.locs||[]).map(function(c){return c.loc;}).join(', ')});
  else if(a&&a.lvl==='verif')out.push({k:'red',t:'În verificare: serie inexistentă în stoc'});
  if(w.tipPiesa==='cupon'){var it=findP(w.stockId);out.push({k:'yel',t:'Cupon '+fmtM(w.lungStoc)+' m'+(it&&it.orig?' din '+it.orig:'')+' — acceptat'});}
  if(w.corr)out.push({k:'yel',t:'Corecție: marcaj '+fmtM(w.corr.marcaj)+' ≠ stoc '+fmtM(w.corr.stoc)+' m'});
  if(w.taiata)out.push({k:'neu',t:'Tăiată din '+fmtM(w.lungStoc)+' m · '+(w.cuponId?'cupon '+fmtM(w.lungStoc-w.lungMont)+' m → stoc':'rest '+fmtM(w.deseu)+' m → deșeu')});
  return out;
}
function vCard(w){
  var a=w.alert,lvl=a?a.lvl:null,red=!!lvl,cls=red?'l-block':(w.tipPiesa==='cupon'||w.corr)?'l-info':'l-ok';
  var len=(lvl==='block')?'<span class="wlen dim">—</span>':'<span class="wlen num">'+fmtM(w.lungMont)+'<small> m</small></span>';
  var notes=cardNote(w).map(function(n){return '<div class="wal wal--'+n.k+'">'+n.t+'</div>';}).join('');
  var fix=lvl==='block'||lvl==='conflict';
  return '<article class="wc '+cls+(S.draft.editId===w.id?' editing':'')+'" id="wc-'+w.id+'"><div class="wmain"><div class="wl1"><span class="wnr num"><span class="nrp">'+w.tr+'S</span>'+pad3(w.nr)+'</span><span class="sp"></span>'+len+'</div>'+
   '<div class="wl2">'+(w.taiata?'<span class="wcut" title="Țeavă tăiată" aria-label="Țeavă tăiată">'+ic('cut')+'</span>':'')+'<b class="mono">'+esc(w.serie)+'</b><span>'+esc(sarjaTxt(w.sarja))+'</span><span class="muted">'+(w.modif?'modif. '+fT(w.modif):fT(w.creat))+'</span>'+synChip(w)+'</div>'+notes+'</div>'+
   '<div class="wbtns"><button class="ib'+(fix?' ib-p':'')+'" data-act="edit" data-id="'+w.id+'" aria-label="'+(fix?'Rezolvă':'Editează')+' '+nrStr(w.tr,w.nr)+'">'+ic('edit')+'<span>'+(fix?'Rezolvă':'Editează')+'</span></button><button class="ib" data-act="del" data-id="'+w.id+'" aria-label="Șterge '+nrStr(w.tr,w.nr)+'">'+ic('trash')+'<span>Șterge</span></button></div></article>';
}
function vList(list,sm){
  var t=S.tr,h=HIST[t],sorted=list.slice().sort(function(a,b){return b.nr-a.nr;});
  var first=list.reduce(function(m,w){return w.creat<m?w.creat:m;},'9');
  var x='<div class="lhead"><div><h2>Sesiunea '+t+'</h2><div class="muted sm">'+(list.length?'începută '+(isToday(first)?'azi '+hm(new Date(first)):fD(first)+' '+hm(new Date(first))+(fT(first).indexOf('ieri')===0?' (ieri)':''))+' · '+pl(list.length,'sudură','suduri')+' · '+fmtM(sm.metri)+' m':'nicio sudură încă')+'</div></div><span class="sp"></span>'+
    (UI.undo?'<button class="btn btn-s" data-act="undo">'+ic('undo')+'Desfă ultima ('+UI.undo.short+')</button>':'')+
    ((list.length&&(dirty()||editW()))?'<button class="btn btn-s" data-act="go-sum">Trimite la aprobare'+ic('arrow')+'</button>':'')+'</div>';
  if(UI.boot)x+='<div class="wcs"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  else if(!list.length)x+='<div class="sempty">Nicio sudură în sesiune. Începe cu seria primei țevi.</div>';
  else x+='<div class="wcs">'+sorted.map(vCard).join('')+'</div>';
  S.subs.filter(function(s){return s.tr===t;}).slice().reverse().forEach(function(l){var ls=lotSync(l);
    x+='<div class="lot lot--'+ls+'"><span class="lic">'+(ls==='ok'?ic('send'):ls==='respins'?lv('block'):ls==='sending'?'<span class="spin"></span>':ic('clock'))+'</span><div class="sp"><b>'+(ls==='ok'?'Trimis la aprobare · '+fT(l.ts):ls==='respins'?'Trimitere respinsă la sincronizare':ls==='sending'?'Se trimite la aprobare…':'În coadă pentru aprobare · '+fT(l.ts))+'</b><div class="sm">'+pl(l.n,'sudură','suduri')+' ('+nrStr(t,l.a)+' – '+nrStr(t,l.b)+') · '+fmtM(l.metri)+' m'+(ls==='respins'?' · conflict pe '+l.motiv+' — rezolvă și retrimite':ls==='pending'?' · pleacă când ai semnal':'')+'</div></div>'+(ls==='pending'?'<button class="btn btn-ro" data-act="retract" data-id="'+l.id+'">'+ic('undo')+'Retrage</button>':'')+'</div>';});
  if(h)x+='<div class="histl">'+t+'S001 – '+t+'S'+pad3(h.max)+' · '+h.max+' suduri aprobate anterior (nu se mai editează de pe tabletă)</div>';
  return x;
}
function primary(r,list,sm){
  var d=S.draft,ew=editW(),nr=r.nrTxt;
  if(!dirty()&&!ew){
    if(!list.length)return {cls:'btn-s',dis:1,icon:'send',l1:'Trimite la aprobare',l2:'nicio sudură în sesiune',why:'Nicio sudură în sesiune încă — începe cu seria primei țevi',focus:'st2'};
    if(sm.block.length)return {cls:'btn-ro',act:'go-sum',icon:'arrow',l1:pl(sm.block.length,'blocantă','blocante')+' — vezi rezumatul',l2:'trimiterea e blocată'};
    return {cls:'btn-p',act:'go-sum',icon:'send',l1:'Trimite la aprobare',l2:pl(list.length,'sudură','suduri')+' · '+fmtM(sm.metri)+' m'};
  }
  if(!r.complete)return {cls:'btn-s',dis:1,icon:'check',l1:d.free?'Verifică seria':'Tastează seria țevii',l2:'apoi verifici lungimea',why:d.free?'Scrie seria completă și apasă „Verifică seria”':'Tastează ultimele 3 cifre ale seriei',focus:'st2'};
  if(r.taken)return {cls:'btn-s',dis:1,icon:'x',l1:'Numărul '+nr+' e ocupat',l2:'alege alt număr',why:'Numărul '+nr+' e ocupat — alege alt număr',focus:'st1'};
  if(r.status==='ok'||r.status==='info'){
    if(d.lmode==='stoc')return {cls:'btn-ok',act:'save',icon:'check',l1:ew?'Lungime corectă — salvează modificarea':'Lungime corectă — salvează',nr:nr,l2:fmtM(r.item.lung)+' m'};
    if(r.lenState!=='ok')return {cls:'btn-s',dis:1,icon:'check',l1:d.lmode==='taiata'?'Tastează lungimea montată':'Tastează lungimea de pe marcaj',l2:'pe tastatura din pasul 3',why:r.lenState==='empty'?'Tastează lungimea în pasul 3':'Lungimea tastată nu e validă — corecteaz-o',focus:'lendisp'};
    if(d.lmode==='taiata')return {cls:'btn-ok',act:'save',icon:'check',l1:ew?'Salvează modificarea':'Salvează',nr:nr,l2:fmtM(r.lenVal)+' m · '+(r.cupon?'cupon '+fmtM(r.rest)+' m':'rest deșeu')};
    return {cls:'btn-ok',act:'save',icon:'check',l1:'Salvează cu lungimea de pe marcaj',nr:nr,l2:fmtM(r.lenVal)+' m'};
  }
  if(r.status==='block')return {cls:'btn-p',act:'ser-clear',icon:'edit',l1:'Corectează seria',l2:'seria e deja montată'};
  if(!d.verif)return {cls:'btn-p',act:'ser-clear',icon:'edit',l1:'Corectează seria',l2:'sau „Trimite la verificare”'};
  if(!d.usarja)return {cls:'btn-s',dis:1,icon:'search',l1:'Alege sarja de pe marcaj',l2:'pasul 3',why:'Alege sarja de pe marcaj (sau „Nu se vede”)',focus:'st3'};
  if(r.ulenState!=='ok')return {cls:'btn-s',dis:1,icon:'search',l1:'Tastează lungimea măsurată',l2:'pasul 3',why:'Tastează lungimea măsurată pe țeavă',focus:'ulendisp'};
  return {cls:'btn-p',act:'save-verif',icon:'search',l1:'Salvează · în verificare',nr:nr,l2:fmtM(r.ulenVal)+' m'};
}
function pbtn(p){
  return '<button class="btn '+p.cls+' pbtn" id="pbtn" data-act="'+(p.act||'noop')+'"'+(p.dis?' aria-disabled="true" data-why="'+esc(p.why||'')+'" data-focus="'+(p.focus||'')+'"':'')+'>'+ic(p.icon||'check')+'<span class="bl"><span class="l1">'+p.l1+'</span><span class="l2">'+(p.nr?'<b class="pnr">'+p.nr+'</b> · ':'')+(p.l2||'')+'</span></span></button>';
}
function vBottom(status,p){
  var t=UI.toast,inner;
  if(t)inner=(t.undo&&UI.undo?'<button class="btn btn-s ubtn" data-act="undo">'+ic('undo')+'Desfă</button>':'')+'<div class="bst" id="bst"><div class="tbar '+t.kind+'" role="status">'+t.msg+'</div></div>';
  else inner='<div class="bst" id="bst">'+status+'</div>';
  return '<div class="bottom" id="bottom"><div class="bin">'+inner+pbtn(p)+'</div></div>';
}
function vGpsWarn(){
  if(!gpsMismatch())return '';
  var g=gpsNow();
  return alertBox('info','info','Ești la km '+kmFmt(g.km)+' ('+g.tr+'), dar înregistrezi pe '+S.tr,'Verifică tronsonul înainte de prima sudură.','<button class="btn btn-s" data-act="gps-stay">Rămân pe '+S.tr+'</button><button class="btn btn-p" data-act="gps-switch" data-tr="'+g.tr+'">Treci pe '+g.tr+'</button>','al-gps');
}
function vLucru(){
  var r=evalDraft(),list=sesWelds(S.tr),sm=sumar(list);
  var st=list.length?('<b class="num">'+list.length+'</b> '+(list.length===1?'sudură':'suduri')+' · <b class="num">'+fmtM(sm.metri)+' m</b> · '+pl(sm.cupoane.length,'cupon','cupoane')+(sm.block.length?' · <span class="red b">'+pl(sm.block.length,'blocantă','blocante')+'</span>':'')):'<span class="muted">Nicio sudură în sesiune încă</span>';
  return '<main class="wrap">'+(gpsMismatch()?'<div style="margin-bottom:12px">'+vGpsWarn()+'</div>':'')+'<div class="work"><section class="card form" id="formcard">'+vForm(r)+'</section><section class="listcol" id="listcol">'+vList(list,sm)+'</section></div></main>'+vBottom(st,primary(r,list,sm));
}
function tile(l,v,s,c){return '<div class="tile'+(c?' tile--'+c:'')+'"><div class="lbl">'+l+'</div><div class="tv num">'+v+'</div><div class="ts">'+s+'</div></div>';}
function obs(w){var o=cardNote(w).map(function(n){return n.t;});return o.length?o.join('<br>'):'<span class="muted">—</span>';}
function vRezumat(){
  var t=trObj(S.tr),list=sesWelds(S.tr).sort(function(a,b){return a.nr-b.nr;});
  if(!list.length&&!dirty()){S.screen='lucru';return vLucru();}
  var r=sumar(list),gaps=gapsFor(S.tr),nStie=r.info.length+r.corr.length+r.deseu.length+gaps.length,bl=submitBlock(r);
  var x='<main class="wrap"><div class="phead"><button class="btn btn-s" data-act="back-work">'+ic('left')+'Înapoi la lucru</button><div><h1>Rezumat înainte de trimitere</h1><div class="muted">'+PROIECT.client+' · '+PROIECT.nume+' · <b>'+t.cod+'</b> km '+t.a+'+000 – '+t.b+'+000 · '+AZI+' · către managerul de proiect</div></div></div>';
  if(dirty()){var r0=evalDraft();
    x+='<section class="panel panel--red" id="pdirty"><div class="pt">'+lv('block')+'Sudura '+r0.nrTxt+(r0.serie?' · '+esc(r0.serie):'')+' nu e salvată</div><div class="prow"><span class="sp">E încă în formular. Salveaz-o sau renunță la ea înainte de trimitere.</span>'+
       ((r0.ready&&(r0.status==='ok'||r0.status==='info'))?'<button class="btn btn-ok" data-act="dirty-save-here">'+ic('check')+'Salvează acum</button>':'<button class="btn btn-p" data-act="back-work">Completează în formular</button>')+'<button class="btn btn-ro" data-act="dirty-drop-here">Renunț la ea</button></div></section>';}
  x+=vPendingBands(S.tr);
  if(list.length){
  x+='<div class="tiles">'+tile('Suduri',r.n,nrStr(t.cod,list[0].nr)+' – '+nrStr(t.cod,list[list.length-1].nr))+
     tile('Metri montați',fmtM(r.metri)+' m',pl(r.n-r.cupF-r.block.length-r.verif.length,'țeavă','țevi')+' + '+pl(r.cupF,'cupon','cupoane')+(r.block.length||r.verif.length?' · fără blocante / verificare':''))+
     tile('Cupoane generate',r.cupoane.length,r.cupoane.length?fmtM(r.mCup)+' m revin în stoc':'nicio țeavă tăiată')+
     tile('Blocante',r.block.length,r.block.length?'trimiterea e blocată':'niciuna',r.block.length?'red':'grn')+
     tile('În verificare',r.verif.length,r.verif.length?fmtM(r.mVerif)+' m neconfirmați':'nicio serie',r.verif.length?'red':'grn')+
     tile('De știut',nStie,nStie?'cupoane, corecții, numere sărite':'nimic deosebit',nStie?'yel':'grn')+'</div>';
  if(r.block.length)x+='<section class="panel panel--red" id="pblock"><div class="pt">'+lv('block')+(r.block.length===1?'O alertă blocantă':r.block.length+' alerte blocante')+' — sesiunea nu se poate trimite</div>'+r.block.map(function(w){var a=w.alert;return '<div class="prow"><b class="num">'+nrStr(w.tr,w.nr)+'</b><span class="sp">'+(a.lvl==='conflict'?'Conflict la sincronizare: <span class="mono">'+esc(w.serie)+'</span> e montată și pe <b>'+a.loc+'</b> ('+a.cine+', '+a.ora+')':blockMsg(a.locs||[],w.serie))+'</span><button class="btn btn-p" data-act="resolve" data-id="'+w.id+'">Rezolvă'+ic('arrow')+'</button></div>';}).join('')+'</section>';
  if(r.verif.length)x+='<section class="panel panel--red" id="pverif"><div class="pt">'+lv('q')+'Serii în verificare — blochează pachetul de lansare'+(S.verifBlocks?' și trimiterea':'')+'</div>'+r.verif.map(function(w){return '<div class="prow"><b class="num">'+nrStr(w.tr,w.nr)+'</b><span class="sp"><span class="mono">'+esc(w.serie)+'</span> · '+esc(sarjaTxt(w.sarja))+' · '+fmtM(w.lungMont)+' m măsurați — nu există în '+PROIECT.stoc+'; o confirmă magazia.</span><button class="btn btn-s" data-act="resolve" data-id="'+w.id+'">'+ic('edit')+'Editează</button></div>';}).join('')+
     (S.verifBlocks?'':'<div class="prow muted sm">Sesiunea pleacă la manager; pachetul de lansare rămâne blocat până confirmă magazia. (Decizie deschisă — vezi Ghid demo.)</div>')+'</section>';
  if(nStie)x+='<section class="panel panel--yel"><div class="pt">'+lv('info')+'De știut — nu blochează trimiterea</div>'+
     r.info.map(function(w){var it=findP(w.stockId);return '<div class="prow"><b class="num">'+nrStr(w.tr,w.nr)+'</b><span class="sp">Cupon acceptat: <span class="mono">'+esc(w.serie)+'</span> · '+fmtM(w.lungStoc)+' m'+(it&&it.orig?' din '+it.orig:'')+'</span></div>';}).join('')+
     r.corr.map(function(w){return '<div class="prow"><b class="num">'+nrStr(w.tr,w.nr)+'</b><span class="sp">Corecție lungime: marcaj '+fmtM(w.corr.marcaj)+' m ≠ stoc '+fmtM(w.corr.stoc)+' m — magazia corectează fișa țevii</span></div>';}).join('')+
     r.deseu.map(function(w){return '<div class="prow"><b class="num">'+nrStr(w.tr,w.nr)+'</b><span class="sp">Rest '+fmtM(w.deseu)+' m → deșeu (sub '+fmtM(MIN_CUPON)+' m)</span></div>';}).join('')+
     (gaps.length?'<div class="prow"><b>Numere sărite</b><span class="sp">'+gaps.map(function(n){return nrStr(t.cod,n);}).join(', ')+' — fără sudură înregistrată.</span></div>':'')+'</section>';
  if(r.cupoane.length)x+='<section class="panel"><div class="pt">'+ic('cut')+'Fișe de tăiere — le generează managerul de proiect</div>'+r.cupoane.map(function(w){return '<div class="prow"><b class="num">'+nrStr(w.tr,w.nr)+'</b><span class="sp"><span class="mono">'+esc(w.serie)+'</span> / '+w.sarja+': din '+fmtM(w.lungStoc)+' m s-au montat '+fmtM(w.lungMont)+' m · cupon <b>'+fmtM(w.lungStoc-w.lungMont)+' m</b> → stoc</span></div>';}).join('')+'</section>';
  x+='<section class="card"><h2 style="margin-bottom:8px">Sudurile din sesiune</h2><div class="tscroll"><table class="t"><thead><tr><th>Nr. sudură</th><th>Serie țeavă</th><th>Sarjă</th><th style="text-align:right">Lungime</th><th>Observații</th><th>Sincronizare</th></tr></thead><tbody>'+
     list.map(function(w){var red=!!w.alert;return '<tr class="'+(red?'tr-block':'')+'"><td class="b num">'+nrStr(w.tr,w.nr)+'</td><td class="mono">'+esc(w.serie)+'</td><td>'+esc(sarjaTxt(w.sarja))+'</td><td class="num b" style="text-align:right;white-space:nowrap">'+(w.tipPiesa==='blocat'?'—':fmtM(w.lungMont)+' m')+'</td><td>'+obs(w)+'</td><td>'+synChip(w)+'</td></tr>';}).join('')+'</tbody></table></div></section>';
  }
  x+='</main>';
  var p=S.outbox.length;
  var msg=bl?'<span class="red b">'+bl.why+'</span>':!S.online?'<b>Offline:</b> trimiterea intră în coadă și pleacă automat când revine semnalul'+(p?' (după '+pl(p,'înregistrare','înregistrări')+')':''):'Trimiți <b>'+pl(r.n,'sudură','suduri')+'</b> · <b>'+fmtM(r.metri)+' m</b> către managerul de proiect';
  var pr=bl?{cls:'btn-ok',dis:1,icon:'send',l1:'Trimite managerului de proiect',l2:'blocat — vezi mesajul',why:bl.why,focus:bl.focus}:{cls:'btn-ok',act:'submit',icon:'send',l1:'Trimite managerului de proiect',l2:pl(r.n,'sudură','suduri')+' · '+fmtM(r.metri)+' m'};
  if(!list.length)pr={cls:'btn-s',dis:1,icon:'send',l1:'Trimite managerului de proiect',l2:'nicio sudură',why:'Nicio sudură salvată în sesiune',focus:'pdirty'};
  return x+vBottom(msg,pr);
}
function vTrimis(){

  var h1=ls==='ok'?'Trimis managerului de proiect':ls==='sending'?'Se trimite…':ls==='respins'?'Trimitere respinsă — conflict la sincronizare':'Gata de trimis — pleacă când revine semnalul';
  var pnl=ls==='ok'?'<div class="panel panel--grn" style="text-align:left"><b class="grn">A ajuns pe server</b> — trimis la '+fT(lot.ts)+', confirmat la '+fT(S.lastSync)+'. Managerul de proiect îl vede acum în ERP.</div>'
    :ls==='sending'?'<div class="panel" style="text-align:left"><b>Se trimite…</b> câteva secunde.</div>'

   (ls==='respins'?'':'<div class="nextl">Ce urmează: managerul de proiect verifică sesiunea'+(lot.nCup?' și generează '+pl(lot.nCup,'fișă de tăiere','fișe de tăiere'):'')+(lot.nVerif?'; '+pl(lot.nVerif,'serie e','serii sunt')+' în verificare la magazie':'')+'.</div>')+

function lenKey(v,k){
  if(k===','){if(v.indexOf(',')<0)v=(v||'0')+',';return {v:v};}
  var p=v.split(',');
  if(p.length>1){if(p[1].length>=2)return {v:v,err:'Maxim 2 zecimale (ex. 12,47)'};return {v:v+k};}
  var ip=p[0];
  if(ip==='')ip=k;else if(+(ip+k)<=12)ip=ip+k;else return {v:ip+','+k};
  if(ip.length>=2||(+ip)*10>12||ip==='0')return {v:ip+','};
  return {v:ip};
}

    if(t==='cfm'&&m.buf.length>0)m.bad=m.bad&&m.buf.length?null:m.bad;
    if(t==='cfm'&&m.buf.length===3)cfmCheck();

  d.touched=true;
  if(t==='ser'){
    var added=false;
    if(k==='⌫')d.digits=d.digits.slice(0,-1);else if(k==='C')d.digits='';else if(d.digits.length<3){d.digits+=k;added=true;fx('#slot'+(d.digits.length-1),'pop');}
    else return; // a 4-a cifră nu schimbă nimic

  }

  d[f]=v;

    case 'gps-stay':S.gpsAck=S.tr+'|'+S.gps;buzz('tap');break;
    case 'gps-switch':switchTrKeep(ds.tr);break;
    case 'gps-cont':var mk=UI.modal&&UI.modal.kind;UI.modal=null;S.gpsAck=S.tr+'|'+S.gps;if(mk)trySave(mk);break;
    case 'go-tr':buzz('tap');openTr(ds.tr);break;
    case 'go-start':S.screen='start';UI.scrollTo='top';break;
    case 'nr-':d.nr=Math.max(1,d.nr-1);d.nrAuto=!d.editId&&d.nr===nextNr(d.tr);d.insert=false;fxNr();break;
    case 'nr+':d.nr=Math.min(999,d.nr+1);d.nrAuto=!d.editId&&d.nr===nextNr(d.tr);d.insert=false;fxNr();break;
    case 'nr-next':d.nr=nextNr(d.tr,d.editId);d.nrAuto=!d.editId;d.insert=false;break;
    case 'nr-edit':UI.modal={t:'nr',buf:''};break;
    case 'nrm-ok':var nn=parseInt((UI.modal&&UI.modal.buf)||'0',10);if(nn>=1&&nn<=999&&!nrTaken(d.tr,nn,d.editId)){d.nr=nn;d.nrAuto=!d.editId&&nn===nextNr(d.tr);d.insert=false;UI.modal=null;}break;
    case 'nrm-ins':var ni=parseInt((UI.modal&&UI.modal.buf)||'0',10);if(insPlan(d.tr,ni,d.editId)){d.nr=ni;d.nrAuto=false;d.insert=true;UI.modal=null;buzz('ok');}break;
    case 'ins-on':d.insert=true;d.nrAuto=false;buzz('ok');break;
    case 'ins-off':d.insert=false;d.nr=nextNr(d.tr);d.nrAuto=true;break;
    case 'open-w':var pf0=S.draft.prefix;S.draft=newDraft(S.tr,pf0);startEdit(ds.id);break;
    case 'key':keyInput(ds.t,ds.k);fx('[data-act="key"][data-t="'+ds.t+'"][data-k="'+ds.k+'"]','press');break;
    case 'prefix':d.prefix=ds.p;d.digits='';d.sel=null;break;
    case 'free-on':d.free=true;d.freeTxt=d.prefix+d.digits;d.sel=null;d.checked=false;UI.focus='freeIn';break;
    case 'free-off':var ft=normSer(d.freeTxt);d.free=false;d.digits=ft.indexOf(d.prefix)===0?ft.slice(d.prefix.length).replace(/\D/g,'').slice(0,3):'';d.sel=null;d.checked=false;break;
    case 'free-check':var r0=evalDraft();if(r0.fmtOk){d.checked=true;d.touched=true;var rf=evalDraft();if(rf.status==='block'||rf.status==='unknown'){buzz('err');fx('#al-ser','shake');}else buzz('ok');UI.scrollTo='st2';}break;
    case 'pick':
      var it=findP(ds.id);if(!it||!isAvail(it,editW()))break;
      d.sel=it.id;d.lmode='stoc';d.len='';d.ulen='';d.verif=false;d.touched=true;
      if(!d.free&&it.serie.indexOf(d.prefix)===0&&it.serie.length===d.prefix.length+3)d.digits=it.serie.slice(d.prefix.length);else{d.free=true;d.freeTxt=it.serie;d.checked=true;}
      UI.tapGuard=performance.now()+450;buzz('ok');UI.scrollTo='st3';break;
    case 'ser-clear':d.digits='';d.sel=null;d.checked=false;d.freeTxt='';d.lmode='stoc';d.len='';d.ulen='';d.verif=false;d.usarja='';d.touched=true;if(d.free)UI.focus='freeIn';UI.scrollTo='st2';break;
    case 'lm':d.lmode=d.lmode===ds.m?'stoc':ds.m;d.len='';d.restMode='deseu';d.touched=true;UI.scrollTo=d.lmode==='stoc'?'st3':'st3';break;
    case 'rest':d.restMode=ds.m;d.touched=true;break;
    case 'len-clear':d.len='';break;
    case 'ulen-clear':d.ulen='';break;
    case 'verif-on':d.verif=true;d.touched=true;UI.scrollTo='st3';break;
    case 'sarja':d.usarja=ds.s;d.touched=true;break;
    case 'save':trySave('ok');break;
    case 'save-block':trySave('block');break;
    case 'save-verif':trySave('verif');break;
    case 'edit':startEdit(ds.id);break;
    case 'edit-cancel':var p2=S.draft.prefix;S.draft=newDraft(S.tr,p2);say('Editare renunțată — sudura a rămas neschimbată','info');break;
    case 'del':
      var w=findW(ds.id);if(!w)break;var cu=cuponUsed(w);
      if(cu){buzz('err');say('Nu se poate șterge: cuponul tăiat din '+nrStr(w.tr,w.nr)+' e montat pe '+cu+'. Șterge întâi '+cu+'.','err');break;}
      UI.modal={t:'del',id:w.id};break;
    case 'del-ok':delWeld(ds.id);break;
    case 'undo':doUndo();return;
    case 'go-sum':S.screen='rezumat';UI.scrollTo='top';break;
    case 'back-work':S.screen='lucru';UI.scrollTo='top';break;
    case 'resolve':var rw=findW(ds.id);if(rw){S.tr=rw.tr;S.screen='lucru';startEdit(ds.id);}break;
    case 'submit':submit();break;
    case 'retract':retract(ds.id);break;
    case 'new-session':S.screen='lucru';var p3=S.draft.prefix;S.draft=newDraft(S.tr,p3);UI.scrollTo='top';break;
    case 'dirty-save':case 'dirty-drop':
      var nx=UI.modal&&UI.modal.next;UI.modal=null;
      if(a==='dirty-save'){var rs=evalDraft();if(!(rs.ready&&(rs.status==='ok'||rs.status==='info')&&!rs.taken)){buzz('err');break;}saveWeld('ok');}
      else{S.draft=newDraft(S.tr,S.draft.prefix);say('Sudura nesalvată a fost lăsată deoparte','warn');}
      if(nx){var nds={};for(var kk in nx.ds)nds[kk]=nx.ds[kk];nds._force=1;act(nx.a,nds);return;}
      break;
    case 'dirty-save-here':var rh=evalDraft();if(rh.ready&&(rh.status==='ok'||rh.status==='info')&&!rh.taken)saveWeld('ok');break;
    case 'dirty-drop-here':S.draft=newDraft(S.tr,S.draft.prefix);say('Sudura nesalvată a fost lăsată deoparte','warn');break;
    case 'stale':S.stocCache=new Date(Date.now()-6*36e5).toISOString();UI.modal=null;S.screen=S.screen==='start'?'lucru':S.screen;say('Stocul de pe tabletă e acum „vechi de 6 h” (simulare)','info');break;
    case 'simfail':UI.simFail=!UI.simFail;break;
    case 'vdec':S.verifBlocks=ds.v==='A';break;
    case 'ack-load':UI.loadMsg=null;break;
    case 'reload-tab':var o=load();if(o)S=o;UI.otherTab=false;say('Am preluat datele din celălalt tab','info');break;
    default:if(a.indexOf('scen-')===0)scen(a);
  }
  render();
}
function fxNr(){var r=evalDraft();if(r.taken){buzz('err');fx('#al-nr','shake');}}

/* ---------------- evenimente ---------------- */
document.addEventListener('touchstart',function(){}, {passive:true}); // :active pe iOS
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a!=='key'&&a!=='modal-close'&&performance.now()<UI.tapGuard){e.preventDefault();return;}
  if(b.getAttribute('aria-disabled')==='true'){
    e.preventDefault();buzz('err');var why=b.getAttribute('data-why'),f=b.getAttribute('data-focus');
    if(why)say(why,'err');if(f){fx('#'+f,'shake');UI.scrollTo=f;}if(b.id)fx('#'+b.id,'shake');render();return;
  }
  if(a==='noop')return;
  if(a==='key'&&UI.lpFired){UI.lpFired=false;return;}
  if(a==='undo'&&performance.now()-UI.undoAt<700)return;
  if(b.tagName==='BUTTON'&&a!=='key')buzz('tap');else if(a==='key')buzz('tap');
  act(a,b.dataset);
});
document.addEventListener('pointerdown',function(e){
  UI.lpFired=false;clearTimeout(UI.lp);
  var b=e.target.closest&&e.target.closest('[data-act="key"][data-k="⌫"]');if(!b)return;
  var t=b.getAttribute('data-t');
  UI.lp=setTimeout(function(){UI.lpFired=true;keyInput(t,'C');buzz('warn');render();},600);
});
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,function(){clearTimeout(UI.lp);},true);});
function onFree(e){
  if(!e.target||e.target.id!=='freeIn'||e.isComposing)return;
  var d=S.draft;d.freeTxt=e.target.value;d.sel=null;d.checked=false;d.lmode='stoc';d.len='';d.ulen='';d.verif=false;d.touched=true;
  var r=evalDraft(),sg=$('#sugg'),cb=$('#freechk'),fm=$('#freefmt');
  if(sg)sg.innerHTML=vSugg(r);
  if(fm)fm.innerHTML=fmtMsg(r);
  if(cb){if(r.fmtOk){cb.removeAttribute('aria-disabled');}else{cb.setAttribute('aria-disabled','true');cb.setAttribute('data-why','Seria are 10 caractere: 3 cifre + 2 litere + 5 cifre (ex. 254CA10206)');cb.setAttribute('data-focus','freeIn');}}
  persist();
}
document.addEventListener('input',onFree);
document.addEventListener('compositionend',onFree);
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target,inInput=tg&&tg.tagName==='INPUT';
  if(e.key==='Escape'){if(UI.modal){UI.modal=null;render();}return;}
  if(inInput){if(tg.id==='freeIn'&&e.key==='Enter'){e.preventDefault();act('free-check',{});}return;}
  if(UI.modal){var mt=UI.modal.t;if(mt==='nr'||mt==='cfm'){var kt=mt==='nr'?'nrm':'cfm';
      if(/^\d$/.test(e.key)){e.preventDefault();act('key',{t:kt,k:e.key});}
      else if(e.key==='Backspace'){e.preventDefault();act('key',{t:kt,k:'⌫'});}
      else if(e.key==='Enter'&&mt==='nr'){e.preventDefault();var ob=$('#modal [data-act="nrm-ok"]');if(ob)ob.click();}}
    return;}
  if(S.screen!=='lucru'&&S.screen!=='rezumat')return;
  var t=S.screen==='lucru'?kpTarget():null;
  if(/^\d$/.test(e.key)&&t){e.preventDefault();act('key',{t:t,k:e.key});}
  else if((e.key===','||e.key==='.')&&(t==='len'||t==='ulen')){e.preventDefault();act('key',{t:t,k:','});}
  else if(e.key==='Backspace'&&t){e.preventDefault();act('key',{t:t,k:'⌫'});}
  else if(e.key==='Backspace'&&S.screen==='lucru'&&!S.draft.free&&S.draft.digits.length===3){e.preventDefault();act('key',{t:'ser',k:'⌫'});}
  else if(e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;var pb=$('#pbtn');if(pb){e.preventDefault();pb.click();}}
});
window.addEventListener('storage',function(e){if(e.key===LS_KEY){UI.otherTab=true;render();}});
window.addEventListener('resize',function(){var top=$('#top');if(top)document.documentElement.style.setProperty('--hdr',top.offsetHeight+'px');var bt=$('#bottom');document.documentElement.style.setProperty('--bh',(bt?bt.offsetHeight:0)+'px');});

render();
setTimeout(function(){UI.boot=false;render();},650);
scheduleAuto(800);
// acces pentru teste automate
window.__izo={get S(){return S;},get UI(){return UI;},act:act,evalDraft:evalDraft,render:render};
})();
