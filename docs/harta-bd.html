// rânduri estimate (doar tabelele cu >0; restul 0)
const ROWS = {ai_documente_inbox:413,ai_usage_log:414,chat_members:14,chatbot_usage:7,claude_bot_runs:205,claude_bot_silentiate:622,claude_bot_sugestii:863,claude_context:767,claude_docs:35,comanda_linii:42,comenzi:11,comenzi_furnizor:61,comenzi_furnizor_aprobari:24,comenzi_furnizor_counter:12,comenzi_furnizor_linii:122,contracte_linii:1,contracte_subcontract_facturi:113,contracte_terti:40,diurna_payment_details:1120,diurna_payments:3,documente_firma:31,employees:154,executie_alerte_ai:210,executie_alocari_personal:151,executie_faze_determinante:26,executie_pachete_lansare:7,executie_proiecte:18,executie_situatii_plata:34,executie_situatii_plata_linii:64,executie_tevi:381,executie_tura_activitati:36,executie_tura_naveta:40,facturi_emise:47,hr_autorizatii:360,hr_autorizatii_tipuri:54,hr_cereri_concediu:84,hr_concediu_tokens:117,hr_documente_personale:266,hr_semnaturi_electronice:1,logistica_active:319,logistica_active_km_ore_ajustari:1,logistica_alimentari:1582,logistica_alocari:47,logistica_bonuri_comune:26,logistica_cesiuni_subcontractor:20,logistica_documente:494,logistica_mentenanta_plan:54,logistica_oscar_dispense:82,logistica_piese_catalog:476,logistica_piese_istoric:1173,logistica_qr_submit_log:435,logistica_rezervoare:8,logistica_service_fise:383,logistica_service_intrari:1332,logistica_service_itemi_preset:70,logistica_subcontractori:1,logistica_telemetrie_zilnica:3297,logistica_transporturi:39,logistica_transporturi_continut:80,magazie_tipuri_material:15,nas_documente:194521,nas_proiecte:581,notifications:19052,ordine_deplasare_arhiva:218,pontaj_brut_istoric:39,pontaj_records:14054,profile_sites:18,profiles:16,proiect_articole:284,rag_ingest_queue:31,rag_utilaje:3011,sites:16,stocuri:166,stocuri_miscari:210,talon_extract_staging:38,tichete:54,tichete_istoric:236,transferuri_linii:33,user_module_access:75,whatsapp_messages_processed:557}

// tabele fără FK (nu apar în EDGES) — completăm lista din ROWS + cele cunoscute goale
const EXTRA_TABLES = ['ai_documente_inbox','ai_usage_log','avize_serii_counter','beneficiari','calendar_days','chatbot_conversations','chatbot_easter_eggs','chatbot_usage','claude_bot_runs','claude_bot_sugestii','claude_docs','comenzi_furnizor_counter','evogps_imports_log','facturi_serii_counter','hr_salarii_audit','internal_chats','logistica_service_itemi_preset','logistica_setari','materiale','nas_documente','piese_import_staging','probe_transport_tarife','rag_normative','rag_qr_log','scanner_logs','setari_ordin_deplasare','settings','stocuri','stocuri_miscari','tichete_subcategorii','whatsapp_imports_log']

// ── MODULE (grupare pe prefix / apartenență funcțională) ───────────────────
const MODULE = [
  { k: 'nucleu',    nume: 'Nucleu (oameni & șantiere)', cul: '#58A6FF',
    match: t => ['profiles','employees','sites','beneficiari','app_modules','user_module_access','profile_sites','settings','calendar_days','employee_salaries','hr_employees_private'].includes(t) },
  { k: 'pontaj',    nume: 'Pontaj · HR · Diurnă', cul: '#BC8CFF',
    match: t => /^(pontaj_|hr_|diurna_)/.test(t) || ['supliment_hrana_istoric','ordine_deplasare_arhiva','setari_ordin_deplasare'].includes(t) },
  { k: 'rapoarte',  nume: 'Rapoarte șantier & progres', cul: '#F778BA',
    match: t => /^(rapoarte_zilnice|raport_lucrari|proiect_)/.test(t) },
  { k: 'executie',  nume: 'Execuție & proiecte', cul: '#FF7B72',
    match: t => /^(executie_|probe_|consumuri_)/.test(t) || t === 'nas_proiecte' },
  { k: 'contracte', nume: 'Contracte & financiar', cul: '#3FB950',
    match: t => /^(contracte_|facturi_|gbe_)/.test(t) || t === 'avize_serii_counter' },
  { k: 'achizitii', nume: 'Achiziții & comenzi', cul: '#F0883E',
    match: t => /^(comenzi|comanda_|oferta_|proiecte_ofertare|ctc_)/.test(t) },
  { k: 'magazie',   nume: 'Magazie & stocuri', cul: '#56D4DD',
    match: t => /^(magazie_|magazii|stocuri|materiale|transferuri_|piese_import)/.test(t) },
  { k: 'logistica', nume: 'Logistică & flotă', cul: '#D29922',
    match: t => /^(logistica_|evogps_|avize_cjp|talon_)/.test(t) },
  { k: 'ai',        nume: 'AI · documente · integrare', cul: '#8B949E',
    match: t => /^(claude_|chatbot_|rag_|ai_|nas_documente|documente_firma|scanner_|whatsapp_)/.test(t) },
  { k: 'comunicare',nume: 'Tichete · chat · notificări', cul: '#79C0FF',
    match: t => /^(tichete|internal_chats|chat_|notification)/.test(t) },
  { k: 'altele',    nume: 'Altele', cul: '#6E7681', match: () => true },
]

// ── CONSTRUCȚIE MODEL ──────────────────────────────────────────────────────
const tabele = new Set(EXTRA_TABLES)
for (const e of EDGES) { tabele.add(e.s); tabele.add(e.d) }
const modPt = t => MODULE.find(m => m.match(t))
const inEdges = {}, outEdges = {}
for (const e of EDGES) {
  (outEdges[e.s] = outEdges[e.s] || []).push(e);
  (inEdges[e.d] = inEdges[e.d] || []).push(e)
}
const fmtN = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n)

// ── RANDARE ────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid')
const elPt = {}
for (const m of MODULE) {
  const ts = [...tabele].filter(t => modPt(t).k === m.k).sort()
  if (!ts.length) continue
  const card = document.createElement('div')
  card.className = 'mod'; card.dataset.mod = m.k
  card.innerHTML = `<div class="mod-h"><span class="dot" style="background:${m.cul}"></span>
    <span class="nume" style="color:${m.cul}">${m.nume}</span><span class="cnt">${ts.length}</span></div>`
  for (const t of ts) {
    const nLinks = (outEdges[t]?.length || 0) + (inEdges[t]?.length || 0)
    const row = document.createElement('div')
    row.className = 'tbl'; row.dataset.t = t; row.style.color = m.cul
    row.innerHTML = `<span class="nm">${t}</span>
      ${nLinks ? `<span class="lk">⇄${nLinks}</span>` : ''}
      <span class="rw">${fmtN(ROWS[t] || 0)}</span>`
    row.addEventListener('click', ev => { ev.stopPropagation(); selecteaza(t) })
    card.appendChild(row); elPt[t] = row
  }
  grid.appendChild(card)
}
document.getElementById('stats').textContent = `${tabele.size} tabele · ${EDGES.length} legături`

// ── SVG EDGES ──────────────────────────────────────────────────────────────
const svg = document.getElementById('edges'), wrap = document.getElementById('wrap')
let sel = null
function pozitie(t) {
  const el = elPt[t]; if (!el || el.classList.contains('hidden')) return null
  const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect()
  return { x1: r.left - w.left, x2: r.right - w.left, y: r.top - w.top + r.height / 2 }
}
function deseneaza() {
  svg.setAttribute('width', wrap.scrollWidth); svg.setAttribute('height', wrap.scrollHeight)
  svg.style.width = wrap.scrollWidth + 'px'; svg.style.height = wrap.scrollHeight + 'px'
  let list = [], strong = false
  if (sel) { list = [...(outEdges[sel] || []), ...(inEdges[sel] || [])]; strong = true }
  else if (document.getElementById('toate').checked) list = EDGES
  let html = ''
  for (const e of list) {
    if (e.s === e.d) continue
    const a = pozitie(e.s), b = pozitie(e.d); if (!a || !b) continue
    const [x1, x2] = a.x2 < b.x1 ? [a.x2, b.x1] : (b.x2 < a.x1 ? [a.x1, b.x2] : [a.x1, b.x1])
    const mx = (x1 + x2) / 2
    const cul = modPt(e.s).cul
    html += `<path d="M ${x1} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${x2} ${b.y}"
      fill="none" stroke="${cul}" stroke-width="${strong ? 1.6 : 0.7}"
      opacity="${strong ? 0.85 : 0.14}"></path>`
  }
  svg.innerHTML = html
}

// ── SELECȚIE + PANOU ───────────────────────────────────────────────────────
const panel = document.getElementById('panel')
function selecteaza(t) {
  if (sel === t) { curata(); return }
  sel = t
  document.body.classList.add('focus')
  document.querySelectorAll('.tbl.sel,.tbl.vecin').forEach(e => e.classList.remove('sel', 'vecin'))
  document.querySelectorAll('.mod.are-focus').forEach(e => e.classList.remove('are-focus'))
  elPt[t]?.classList.add('sel')
  const vecini = new Set()
  for (const e of (outEdges[t] || [])) vecini.add(e.d)
  for (const e of (inEdges[t] || [])) vecini.add(e.s)
  vecini.delete(t)
  for (const v of vecini) elPt[v]?.classList.add('vecin')
  for (const x of [t, ...vecini]) elPt[x]?.closest('.mod')?.classList.add('are-focus')
  // panou
  const m = modPt(t)
  document.getElementById('p-dot').style.background = m.cul
  document.getElementById('p-nume').textContent = t
  document.getElementById('p-meta').textContent =
    `${m.nume} · ~${fmtN(ROWS[t] || 0)} rânduri · ${(outEdges[t] || []).length} ieșiri · ${(inEdges[t] || []).length} intrări`
  const rel = (e, dir) => `<div class="rel" data-go="${dir === 'out' ? e.d : e.s}">
    ${dir === 'out'
      ? `<span class="c">${e.c}</span><span class="sag">${e.s === e.d ? '↺' : '→'}</span><span style="color:${modPt(e.d).cul}">${e.d}</span>`
      : `<span style="color:${modPt(e.s).cul}">${e.s}</span><span class="c">.${e.c}</span><span class="sag">${e.s === e.d ? '↺' : '→'}</span>`}
  </div>`
  document.getElementById('p-out').innerHTML = (outEdges[t] || []).map(e => rel(e, 'out')).join('') || '<div class="gol">— nu trimite spre nimic</div>'
  document.getElementById('p-in').innerHTML = (inEdges[t] || []).map(e => rel(e, 'in')).join('') || '<div class="gol">— nimeni nu o referențiază</div>'
  panel.classList.add('on')
  panel.querySelectorAll('.rel').forEach(r => r.addEventListener('click', () => {
    const go = r.dataset.go
    selecteaza(go); elPt[go]?.scrollIntoView({ block: 'center', behavior: 'smooth' })
  }))
  deseneaza()
}
function curata() {
  sel = null
  document.body.classList.remove('focus')
  document.querySelectorAll('.tbl.sel,.tbl.vecin').forEach(e => e.classList.remove('sel', 'vecin'))
  document.querySelectorAll('.mod.are-focus').forEach(e => e.classList.remove('are-focus'))
  panel.classList.remove('on')
  deseneaza()
}
document.getElementById('p-close').addEventListener('click', curata)
document.addEventListener('keydown', e => { if (e.key === 'Escape') curata() })
document.addEventListener('click', e => { if (!e.target.closest('.tbl') && !e.target.closest('#panel')) curata() })

// ── CĂUTARE + TOGGLE ───────────────────────────────────────────────────────
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase()
  for (const [t, el] of Object.entries(elPt)) el.classList.toggle('hidden', !!q && !t.includes(q))
  document.querySelectorAll('.mod').forEach(m =>
    m.classList.toggle('goala', !!q && !m.querySelector('.tbl:not(.hidden)')))
  deseneaza()
})
document.getElementById('toate').addEventListener('change', deseneaza)
window.addEventListener('resize', () => requestAnimationFrame(deseneaza))
requestAnimationFrame(deseneaza)
</script>
